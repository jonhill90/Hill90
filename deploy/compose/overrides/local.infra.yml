# Local development override for the edge stack.
#
# Layered on top of deploy/compose/prod/docker-compose.infra.yml — the SAME file
# production uses. Nothing here forks the stack; it only patches what a Mac
# cannot do: no Tailscale (so no source-IP allowlist), no public DNS and no
# Let's Encrypt (so no certificate resolver), no .htpasswd generated by a
# SOPS-backed deploy (so no basic auth on the dashboard).
#
# Hostnames come from .env.local. Everything else is inherited.

services:
  traefik:
    # The base file passes --certificatesresolvers...caserver flags. Traefik
    # ignores CLI flags entirely when a static config file is mounted, and the
    # local static config defines no resolvers, so the flags are removed here to
    # keep the container's command honest about what it actually does.
    command: []
    labels:
      - "traefik.http.routers.traefik.tls=false"

  portainer:
    # Server-side token exchange needs to REACH Keycloak. auth.localtest.me
    # resolves to 127.0.0.1, which inside a container is the container itself,
    # so the exchange fails with "connection refused" AFTER a successful login —
    # the same trap local.vault.yml already documents for OpenBao.
    extra_hosts:
      - "${AUTH_HOST:-auth}.${BASE_DOMAIN:-hill90.com}:host-gateway"
    labels:
      - "traefik.http.routers.portainer.tls=false"
