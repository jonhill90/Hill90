# Local development override for the observability stack.
#
# Layered on top of deploy/compose/prod/docker-compose.observability.yml — the
# SAME file production uses. Only the routing differences a Mac forces.

services:
  grafana:
    # Server-side token exchange needs to REACH Keycloak. auth.localtest.me
    # resolves to 127.0.0.1, which inside a container is the container itself,
    # so the exchange fails with "connection refused" AFTER a successful login —
    # the same trap local.vault.yml already documents for OpenBao.
    extra_hosts:
      - "${AUTH_HOST:-auth}.${BASE_DOMAIN:-hill90.com}:host-gateway"
    labels:
      - "traefik.http.routers.grafana.tls=false"
      # Traefik reaches this container over the edge network. The provider-wide
      # default lives in the static config, which Traefik v2 cannot interpolate,
      # so it cannot follow NETWORK_PREFIX. This label can, and takes precedence.
      # Defaults to hill90_edge — exactly what production's traefik.yml already
      # pins — so production resolves identically.
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"

  prometheus:
    # Production deliberately does not route Prometheus: it sits on the internal
    # network and is reached through Grafana, so it has no router and publishes
    # no port. That is correct for a server nobody logs into directly.
    #
    # It is wrong for development. Prometheus' own UI is where you check the
    # targets page and use the expression browser, and without this a developer
    # cannot open it at all — port 9090 is not published to the host either.
    # Prometheus is already on the edge network, so routing it locally needs
    # nothing but labels, and none of this reaches production.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_HOST:-prometheus}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.prometheus.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.prometheus.tls=false"
      - "traefik.http.routers.prometheus.middlewares=${ADMIN_MIDDLEWARES:-tailscale-only@file}"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      # Traefik reaches this container over the edge network. The provider-wide
      # default lives in the static config, which Traefik v2 cannot interpolate,
      # so it cannot follow NETWORK_PREFIX. This label can, and takes precedence.
      # Defaults to hill90_edge — exactly what production's traefik.yml already
      # pins — so production resolves identically.
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"
