version: '3.9'

# Infrastructure services: Traefik, dns-manager, Portainer
# Deploy with: make deploy-infra

networks:
  edge:
    driver: bridge
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_internal
  agent_internal:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_agent_internal

volumes:
  traefik-certs:
    name: ${VOLUME_PREFIX:-prod}_traefik-certs
  portainer-data:
    name: ${VOLUME_PREFIX:-prod}_portainer-data

services:
  # Traefik Edge Proxy
  traefik:
    image: traefik:v2.11
    container_name: ${CONTAINER_PREFIX:-}traefik
    restart: unless-stopped
    networks:
      - edge
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    command:
      # Override Let's Encrypt CA server to support staging/production switching
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.letsencrypt-dns.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../../platform/edge/${TRAEFIK_STATIC_CONFIG:-traefik.yml}:/etc/traefik/traefik.yml:ro
      - ../../../platform/edge/dynamic:/etc/traefik/dynamic:ro
      - traefik-certs:/letsencrypt
    environment:
      - ACME_CA_SERVER=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      # DNS-01 challenge via lego's built-in Cloudflare provider. Token must be
      # scoped to the hill90.com zone: Zone/Zone/Read + Zone/DNS/Edit.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST:-traefik}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.traefik.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.traefik.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=${TRAEFIK_MIDDLEWARES:-auth@file,tailscale-only@file}"

  # Portainer Container Management (Tailscale-only access)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ${CONTAINER_PREFIX:-}portainer
    restart: unless-stopped
    networks:
      - edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST:-portainer}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.portainer.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.portainer.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.portainer.service=portainer"
      - "traefik.http.routers.portainer.middlewares=${ADMIN_MIDDLEWARES:-tailscale-only@file}"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
