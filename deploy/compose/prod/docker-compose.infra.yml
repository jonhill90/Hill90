version: '3.9'

# Infrastructure services: Traefik, Portainer
# Deploy with: make deploy-infra
#
# WHICH PATH OWNS WHAT:
#
# THIS FILE is the RUNNING path. It is the single declaration of the traefik and
# portainer containers, and platform/edge/traefik.yml.tmpl (rendered to
# traefik.generated.yml at deploy time) is the authoritative Traefik static
# configuration.
#
# infra/ansible/playbooks/bootstrap.yml is the BOOTSTRAP path. It prepares a
# bare VPS — OS, firewall, Tailscale, Docker, secrets — and stops before
# containers. It must not declare any.
#
# 09-traefik.yml and 10-portainer.yml used to declare these same two containers
# and a second Traefik static config. Nothing imported them, so they drifted,
# and 09 ended up naming a certResolver it never defined. They were deleted.

networks:
  edge:
    driver: bridge
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_internal
  agent_internal:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_agent_internal

volumes:
  traefik-certs:
    name: ${VOLUME_PREFIX:-prod}_traefik-certs
  portainer-data:
    name: ${VOLUME_PREFIX:-prod}_portainer-data

services:
  # Traefik Edge Proxy
  traefik:
    image: traefik:v2.11
    container_name: ${CONTAINER_PREFIX:-}traefik
    restart: unless-stopped
    networks:
      - edge
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # NO `command:` block. Traefik's static-config sources — file, CLI flags and
    # environment variables — are mutually exclusive, and the mounted file wins.
    # This service used to pass
    #   --certificatesresolvers.*.acme.caserver=${ACME_CA_SERVER:-<staging>}
    # which Compose interpolated and Traefik then discarded. The CA is now
    # rendered into the config file itself by scripts/render-traefik-config.sh.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Rendered from platform/edge/traefik.yml.tmpl at deploy time. Generated,
      # gitignored, and the template is what you edit.
      - ../../../platform/edge/${TRAEFIK_STATIC_CONFIG:-traefik.generated.yml}:/etc/traefik/traefik.yml:ro
      - ../../../platform/edge/dynamic:/etc/traefik/dynamic:ro
      - traefik-certs:/letsencrypt
    environment:
      # ACME_CA_SERVER is deliberately NOT here. As an environment variable it
      # was inert (the mounted file wins), and giving it a default here is what
      # made an accidental staging deploy silent. It is consumed by
      # render-traefik-config.sh, which requires it and fails loudly if unset.
      #
      # DNS-01 challenge via lego's built-in Cloudflare provider. Token must be
      # scoped to the hill90.com zone: Zone/Zone/Read + Zone/DNS/Edit.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST:-traefik}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.traefik.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.traefik.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=${TRAEFIK_MIDDLEWARES:-auth@file,tailscale-only@file}"

  # Portainer Container Management (Tailscale-only access)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ${CONTAINER_PREFIX:-}portainer
    restart: unless-stopped
    networks:
      - edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    # LOOPBACK ONLY. Portainer keeps its auth settings in its own database, so
    # scripts/portainer.sh has to reach the API from the host to configure SSO.
    # Without this there is no address on the VPS that resolves to Portainer:
    # every other route is Traefik-only behind the tailscale-only middleware.
    # 127.0.0.1 is not reachable off-host, so this adds no external exposure.
    ports:
      - "127.0.0.1:9000:9000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST:-portainer}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.portainer.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.portainer.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.portainer.service=portainer"
      - "traefik.http.routers.portainer.middlewares=${ADMIN_MIDDLEWARES:-tailscale-only@file}"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
