version: '3.9'

# OpenBao secrets management
# Deploy with: make deploy-vault

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

volumes:
  openbao-data:
    name: ${VOLUME_PREFIX_BARE:-}openbao-data

services:
  openbao:
    # PINNED DELIBERATELY. This was ghcr.io/openbao/openbao:2 — a floating major
    # tag — which means a routine pull would have taken this container to v2.7.0
    # the day it ships. v2.7.0 REMOVES the `file` storage backend that
    # platform/vault/config.hcl uses, so the vault would have failed to start
    # with no warning and no change on our side.
    #
    # Pinning does not fix that; it converts a surprise outage into a deliberate
    # upgrade. Before moving off 2.6.x, migrate the storage backend — the path is
    # written up in docs/decisions/vault-vs-sops.md, section "Decision needed:
    # replacing the `file` storage backend".
    #
    # 2.6.1 is exactly what was running when this was pinned: tags 2, 2.6, 2.6.1
    # and latest all resolved to sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
    # on 2026-07-26, so this pin was a no-op at the time it landed.
    image: ghcr.io/openbao/openbao:2.6.1
    container_name: ${CONTAINER_PREFIX:-}openbao
    restart: unless-stopped
    command: server
    cap_add:
      - IPC_LOCK
    networks:
      - edge
      - internal
    volumes:
      # Data path and config file are selectable so the raft storage variant can
      # be chosen at deploy time. Both default to the file-backend values, so an
      # unset environment resolves to exactly what production has always run.
      # See platform/vault/config.raft.hcl and
      # .github/workflows/vault-reinitialize.yml.
      - openbao-data:${VAULT_DATA_PATH:-/openbao/file}
      - ../../../platform/vault/${VAULT_CONFIG_FILE:-config.hcl}:/openbao/config/config.hcl:ro
      - ../../../platform/vault/policies:/openbao/policies:ro
    environment:
      - BAO_ADDR=http://127.0.0.1:8200
      - BAO_LOCAL_CONFIG=
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`${VAULT_HOST:-vault}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.vault.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.vault.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.vault.middlewares=${ADMIN_MIDDLEWARES:-tailscale-only@file}"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
