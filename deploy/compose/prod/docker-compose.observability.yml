version: '3.9'

# Observability stack: Prometheus, Loki, Tempo, Grafana + collectors
# Deploy with: make deploy-observability

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

volumes:
  prometheus-data:
    name: ${VOLUME_PREFIX_BARE:-}prometheus-data
  loki-data:
    name: ${VOLUME_PREFIX_BARE:-}loki-data
  tempo-data:
    name: ${VOLUME_PREFIX_BARE:-}tempo-data
  grafana-data:
    name: ${VOLUME_PREFIX_BARE:-}grafana-data
  promtail-positions:
    name: ${VOLUME_PREFIX_BARE:-}promtail-positions
  # Holds silences and notification-dedup state. Losing it re-sends currently
  # firing alerts once and drops any active silence; it is not in the nightly
  # backup set and does not need to be — see docs/reference/backup-coverage.md.
  alertmanager-data:
    name: ${VOLUME_PREFIX_BARE:-}alertmanager-data

services:
  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: ${CONTAINER_PREFIX:-}prometheus
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - edge
      - internal
    volumes:
      - ../../../platform/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../platform/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=20GB"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Alertmanager — the missing half. Prometheus had six rules and no receiver.
  #
  # DELIBERATELY NOT PUBLIC. There are no traefik.* labels here, and there must
  # not be: production Traefik sets no provider `constraints`, so any container
  # on the socket with traefik.enable=true and a Host rule is live on the public
  # internet the moment it starts (invariant 3). Alertmanager's UI can silence
  # alerts with no authentication of its own. Reach it over Tailscale with
  # `ssh vps -L 9093:localhost:9093` if you need the UI, or add it behind the
  # same IP-allowlist middleware the other internal services use — deliberately,
  # not by copying a label block.
  #
  # ON `edge` AND NOT ONLY `internal`: hill90_internal is `internal: true`, so a
  # container attached to it alone has NO EGRESS and cannot resolve or reach
  # smtp.hostinger.com. An Alertmanager on internal only would start healthy,
  # accept every alert, and fail every delivery — the exact silent-failure shape
  # this whole change exists to remove. Verified 2026-07-31 by testing both
  # networks.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ${CONTAINER_PREFIX:-}alertmanager
    restart: unless-stopped
    mem_limit: 128m
    # uid stays 65534 (`nobody`, what the image expects and what owns the
    # alertmanager-data volume); gid becomes the deploy group so the 0640
    # rendered config is readable. Dropping either half breaks it — a 0600 config
    # made the container exit with "permission denied" during verification.
    user: "65534:${SECRETS_GID:-1000}"
    networks:
      - edge
      - internal
    volumes:
      # Rendered OUTSIDE the checkout by scripts/render-alertmanager-config.sh
      # because it carries the SMTP password. See that script's header.
      - /opt/hill90/secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # Needed for silences and for links in notifications to be meaningful.
      - "--web.external-url=http://localhost:9093"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Blackbox exporter — the only honest signal for the top two audit gaps.
  #
  # The cheaper options were checked and do not exist here:
  # traefik_service_server_up has zero series, and the tenant's containers are
  # not scrape targets, so ServiceDown structurally cannot fire for hill90.com.
  # See platform/observability/blackbox/blackbox.yml.
  #
  # Also on `edge`: probing hill90.com goes out to public DNS and back through
  # the real edge path, which internal-only cannot do.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: ${CONTAINER_PREFIX:-}blackbox-exporter
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - edge
      - internal
    volumes:
      - ../../../platform/observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:3.5.0
    container_name: ${CONTAINER_PREFIX:-}loki
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - internal
    volumes:
      - ../../../platform/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki.yml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  tempo:
    image: grafana/tempo:2.7.2
    container_name: ${CONTAINER_PREFIX:-}tempo
    restart: unless-stopped
    mem_limit: 2g
    networks:
      - internal
    volumes:
      - ../../../platform/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ${CONTAINER_PREFIX:-}grafana
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - edge
      - internal
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../../platform/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://grafana.hill90.com}
      # --- Keycloak SSO (issue #530) ---------------------------------------
      # THE LOCAL ADMIN LOGIN STAYS. disable_login_form defaults to false and is
      # pinned here so nobody "tidies" it later: Keycloak must never be the only
      # way into Grafana. auto_login is false for the same reason — with it on,
      # the login form is skipped and an unhealthy IdP locks you out.
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=false
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GRAFANA_OIDC_ENABLED:-true}
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      # Explicit endpoints rather than OIDC discovery, deliberately: discovery
      # would make Grafana fetch from Keycloak, and a slow or absent IdP should
      # not affect Grafana starting. Verified: Grafana boots fine with Keycloak
      # stopped and the local login form still works.
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${KC_PUBLIC_URL:-https://auth.hill90.com}/realms/${KC_REALM:-platform}/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${KC_PUBLIC_URL:-https://auth.hill90.com}/realms/${KC_REALM:-platform}/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=${KC_PUBLIC_URL:-https://auth.hill90.com}/realms/${KC_REALM:-platform}/protocol/openid-connect/userinfo
      # Realm role -> Grafana role. Grafana evaluates against the ID token first
      # and falls back to userinfo; keycloak.sh puts realm_access.roles in both.
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(realm_access.roles[*], 'admin') && 'Admin' || contains(realm_access.roles[*], 'editor') && 'Editor' || 'Viewer'
      # Realm roles map to Grafana ORGANISATION roles only. Server-admin rights
      # stay with the local `admin` account, so no SSO identity can ever be more
      # powerful than the fallback login. (Users with no mapped role fall through
      # to Viewer via role_attribute_strict, which defaults to false.)
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-grafana}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.grafana.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.grafana.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.grafana.middlewares=${ADMIN_MIDDLEWARES:-tailscale-only@file}"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  promtail:
    image: grafana/promtail:3.5.0
    container_name: ${CONTAINER_PREFIX:-}promtail
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - internal
    volumes:
      - ../../../platform/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/var/lib/promtail
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "promtail", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ${CONTAINER_PREFIX:-}node-exporter
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - internal
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # The emitting half of the backup alert (#616). The textfile COLLECTOR was
      # already enabled — node_scrape_collector_success{collector="textfile"} is
      # 1 — but with no directory set it read nothing, so the metric never
      # existed. This is the one flag that was missing.
      #
      # Path is under the EXISTING /rootfs mount, so no new mount is needed:
      # backup.sh writes /opt/hill90/metrics/textfile_collector on the host,
      # which appears here as /rootfs/opt/hill90/metrics/textfile_collector.
      # Changing this flag restarts node-exporter, which serves no traffic and
      # sits in no request path — the cost is a gap in metrics measured in
      # seconds.
      - "--collector.textfile.directory=/rootfs/opt/hill90/metrics/textfile_collector"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: ${CONTAINER_PREFIX:-}cadvisor
    restart: unless-stopped
    mem_limit: 128m
    # cAdvisor requires privileged mode to access cgroup and kernel metrics
    privileged: true
    networks:
      - internal
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
