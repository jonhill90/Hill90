version: '3.9'

# Keycloak identity provider
# Deploy with: make deploy-auth

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: ${CONTAINER_PREFIX:-}keycloak
    restart: unless-stopped
    networks:
      - edge
      - internal
    volumes:
      - ../../../platform/auth/keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
      - ../../../platform/auth/keycloak/themes/hill90:/opt/keycloak/themes/hill90:ro
    tmpfs:
      - /opt/keycloak/data/tmp:size=100m
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${DB_USER}
      - KC_DB_PASSWORD=${DB_PASSWORD}
      - KC_HOSTNAME=${KC_HOSTNAME:-https://auth.hill90.com}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HTTP_METRICS_HISTOGRAMS_ENABLED=true
      # Substituted into platform-realm.json at import. Without it the client
      # secret is randomly generated and can never match the value setup-oidc
      # reads from SOPS, so OIDC login fails with invalid_client.
      - VAULT_OIDC_CLIENT_SECRET=${VAULT_OIDC_CLIENT_SECRET}
      # The tenant's hill90-ui client secret, same mechanism as the vault one
      # above. Matters only on a FIRST import: the live realm already has the
      # client, and `start --import-realm` ignores an existing realm. This is
      # what a VPS rebuild depends on.
      #
      # The client's redirect URI and web origin are the LITERAL production
      # values in platform-realm.json. Local does not parameterise them — it
      # appends its callback to the running client, the same delta local.sh
      # already applies to hill90-vault.
      - HILL90_UI_CLIENT_SECRET=${HILL90_UI_CLIENT_SECRET}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m
      - KC_TRACING_ENABLED=true
      - KC_TRACING_ENDPOINT=http://tempo:4317
      - KC_TRACING_PROTOCOL=grpc
      - KC_TRACING_SERVICE_NAME=keycloak
    # Theme caching stays ON here. --spi-theme--cache-themes=false and
    # --spi-theme--static-max-age=-1 are Keycloak's documented theme-AUTHORING
    # settings; local.auth.yml adds them, production must not have them.
    command: start --import-realm
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      # All Keycloak traffic on auth.hill90.com (admin protected by KC credentials + MFA)
      - "traefik.http.routers.keycloak.rule=Host(`${AUTH_HOST:-auth}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.keycloak.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.keycloak.tls.certresolver=${PUBLIC_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.keycloak.service=keycloak"
