name: Validate Repository

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate markdown links
        run: python3 scripts/checks/check_md_links.py

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/scripts/

      - name: Validate compose files
        # Credentials that must never fall back to a default use ${VAR:?...},
        # so `config` refuses to render without them. That guard is deliberate:
        # an empty MinIO root password silently starts the server on
        # minioadmin/minioadmin with only a WARN. Supply throwaway values here —
        # this step validates STRUCTURE, not secrets.
        env:
          MINIO_ROOT_USER: placeholder
          MINIO_ROOT_PASSWORD: placeholder
          MINIO_OIDC_CLIENT_SECRET: placeholder
        run: |
          for f in deploy/compose/prod/docker-compose*.yml; do
            echo "Validating $f..."
            docker compose -f "$f" config > /dev/null
          done

      - name: Validate Traefik config
        run: bash scripts/validate.sh traefik

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: shellcheck --severity=error scripts/*.sh

      - name: Assert deploy safety invariants
        run: |
          echo "Checking: no --remove-orphans..."
          ! (grep -- "--remove-orphans" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#")

          echo "Checking: all docker compose calls use -p..."
          ! (grep "docker compose" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#" | grep -v -- "-p ")

          echo "All safety checks passed."

      - name: Assert compose volume naming
        run: python3 scripts/checks/check_volume_names.py

      - name: Validate local/prod config surface
        run: python3 scripts/checks/check_env_surface.py

      - name: Validate secrets schema consistency
        env:
          SECRETS_SCHEMA_STRICT: "0"
        run: python3 scripts/checks/check_secrets_schema.py

      - name: Assert no destructive volume commands
        run: bash scripts/checks/check_destructive_commands.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check script tests
        run: pip install pytest pyyaml && pytest tests/checks/ -v
