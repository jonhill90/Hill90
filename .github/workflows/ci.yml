name: Validate Repository

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate markdown links
        run: python3 scripts/checks/check_md_links.py

      # h#758 (found by h#736's fix): wired only to its own bats control
      # since it was written. Genuinely hermetic — it counts rules in
      # platform/observability/prometheus/alerts.yml against the sentence in
      # CLAUDE.md, no network or live Prometheus needed (see its own
      # docstring, which explicitly designed it this way FOR CI). There was
      # no design question here, unlike h#738 — just a check that had never
      # been asked to run.
      - name: Assert CLAUDE.md's alert counts match the rules that ship
        run: python3 scripts/checks/check_alert_counts_documented.py

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/scripts/

      - name: Validate compose files
        # Credentials that must never fall back to a default use ${VAR:?...},
        # so `config` refuses to render without them. That guard is deliberate:
        # an empty MinIO root password silently starts the server on
        # minioadmin/minioadmin with only a WARN. Supply throwaway values here —
        # this step validates STRUCTURE, not secrets.
        env:
          MINIO_ROOT_USER: placeholder
          MINIO_ROOT_PASSWORD: placeholder
          MINIO_OIDC_CLIENT_SECRET: placeholder
        run: |
          for f in deploy/compose/prod/docker-compose*.yml; do
            echo "Validating $f..."
            docker compose -f "$f" config > /dev/null
          done

      - name: Validate Traefik config
        run: bash scripts/validate.sh traefik

      # Pinned to the deployed Prometheus version, because promtool's rule
      # semantics are what production will apply — testing against a different
      # version tests a different engine.
      - name: Validate and unit-test Prometheus alert rules
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.3.1 \
            check rules platform/observability/prometheus/alerts.yml
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.3.1 \
            test rules tests/prometheus/alerts_test.yml
          echo
          echo "NOTE: a green run here does NOT prove these rules can fire."
          echo "The unit tests supply their own input series, so a rule matching"
          echo "a label production never emits still passes. That is checked"
          echo "against the live Prometheus by:"
          echo "  python3 scripts/checks/check_alert_series.py   (run on the VPS)"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: shellcheck --severity=error scripts/*.sh

      # h#732 found the dormant 0==0 trap on the second check below (if
      # deploy.sh's invocation style is ever renamed, the grep for "docker
      # compose" matches zero lines and the check finds nothing to complain
      # about — an unchecked invariant, not an upheld one). Fixing it
      # surfaced something more severe in the SAME lines: GitHub Actions
      # runs `run:` blocks under `bash -eo pipefail`, and bash's `set -e`
      # explicitly EXEMPTS a `!`-negated command from triggering abort, even
      # when the negated result is failure. `! (pipeline)` never aborted
      # this step on a real violation — it just fell through to the next
      # line, and the step always ended on the final `echo`'s exit 0.
      # Verified directly, not by reasoning about bash semantics alone:
      # injected a real `docker compose ... ` call with no -p flag into a
      # copy of deploy.sh and ran this exact step, byte for byte, under
      # `bash -eo pipefail` — it printed "All safety checks passed." and
      # exited 0. Both checks are rewritten with an explicit if/exit so a
      # real violation actually fails the step, which the `!`-negated form
      # could not do regardless of the 0==0 trap.
      - name: Assert deploy safety invariants
        run: |
          echo "Checking: no --remove-orphans..."
          if grep -- "--remove-orphans" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#" | grep -q .; then
            echo "::error::scripts/deploy.sh contains --remove-orphans"
            grep -n -- "--remove-orphans" scripts/deploy.sh | grep -v "^#"
            exit 1
          fi

          echo "Checking: all docker compose calls use -p..."
          DC_LINES=$(grep "docker compose" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#" || true)
          if [ -z "$DC_LINES" ]; then
            echo "::error::CANNOT DETERMINE — zero 'docker compose' invocations found in scripts/deploy.sh. Either the invocation pattern changed (renamed, wrapped, hyphenated) and this check is no longer looking at anything real, or deploy.sh itself changed shape. Fix this check before trusting a green run here."
            exit 1
          fi
          if printf '%s\n' "$DC_LINES" | grep -v -- "-p " > /dev/null; then
            echo "::error::a docker compose invocation in scripts/deploy.sh is missing -p"
            printf '%s\n' "$DC_LINES" | grep -v -- "-p "
            exit 1
          fi
          echo "  ok — $(printf '%s\n' "$DC_LINES" | grep -c .) docker compose invocation(s), all use -p"

          echo "All safety checks passed."

      - name: Assert compose volume naming
        run: python3 scripts/checks/check_volume_names.py

      - name: Validate local/prod config surface
        run: python3 scripts/checks/check_env_surface.py

      - name: Assert every referenced OIDC client is created on the deploy path
        run: python3 scripts/checks/check_oidc_clients_reconciled.py

      # h#727: static mode (no --live) is explicitly documented in the
      # script's own module docstring as "static, CI" — this wires that
      # documented, secrets-free half in. It cannot see holders (needs the
      # live realm), so it cannot replace --live; it catches the config-file
      # half of the same property on every PR: a retired role must not be
      # (re)created in keycloak.sh, or named in MinIO's policy list,
      # Grafana's role_attribute_path, or OpenBao's bound_claims.
      #
      # --live is NOT wired here, or anywhere yet, and that is a deliberate
      # stop rather than an oversight: it hardcodes `ssh vps <cmd>` — an SSH
      # config alias literal — and no workflow in this repo defines a "vps"
      # host alias; every other workflow reaches the VPS via
      # `ssh -i ~/.ssh/vps_key ... deploy@$TAILSCALE_IP` directly, with no
      # alias at all. Wiring --live needs either a new alias-setup step here
      # (a real design decision, not obviously the right one — it duplicates
      # what every other workflow already does differently) or refactoring
      # the script to accept an explicit SSH target instead of a hardcoded
      # alias, and validating either path end-to-end needs a real run against
      # production Keycloak/MinIO with decrypted secrets, out of scope for
      # this change. See h#738 for what's left.
      - name: Assert no retired role is granted anything (static)
        run: python3 scripts/checks/check_retired_roles_ungranted.py

      - name: Assert no path revokes root before OIDC is enabled
        run: python3 scripts/checks/check_vault_revoke_order.py

      # h#726: written to catch the exact regression in run 30791332461 (a
      # revoke step's `if:` ANDed with success() skipped it on failure and
      # left a live root token on production), then never invoked — the
      # detection logic was proven only against synthetic bats fixtures,
      # never against this repo's real workflow files. Static and read-only:
      # parses .github/workflows/*.yml from the checkout, no vault, no SSH,
      # no secret. Verified before wiring, against a mutated copy of the
      # real vault-regain-root.yml with the exact historical condition
      # reintroduced: goes red, correctly, on both the revoke-step and the
      # confirm-step half of the property.
      - name: Assert a root-minting workflow revokes and confirms on failure
        run: python3 scripts/checks/check_root_revoke_fails_closed.py

      # h#728: this ran advisory-only (STRICT=0) since it was added — real
      # warnings were printed but never failed the build. Flipped to strict
      # after establishing, not assuming, that it costs nothing today: ran
      # in strict mode against the real repo (zero findings, and confirmed
      # that's a genuine clean by checking the comparison counts — 43
      # compose refs, 38 SOPS keys, 22+4+2+5 schema entries — not an
      # empty-input vacuous pass), confirmed strict and non-strict report
      # IDENTICAL warning content and differ ONLY in the trailing "Strict
      # mode: failing" line and exit code (diffed both against a real
      # injected violation), and positive-controlled the flip itself against
      # a real compose-file mutation: an undeclared ${VAR} added to
      # docker-compose.infra.yml turned this red, reverting it turned this
      # green. See h#728's PR and issue comment for the full inventory. Does
      # NOT cover drift between infra/secrets/prod.enc.env and its own
      # .example template — this check reads only the checked-in example,
      # never the encrypted store.
      - name: Validate secrets schema consistency
        env:
          SECRETS_SCHEMA_STRICT: "1"
        run: python3 scripts/checks/check_secrets_schema.py

      - name: Assert no destructive volume commands
        run: bash scripts/checks/check_destructive_commands.sh

      # A credential in argv is readable by any local user via `ps` — the shell
      # analogue of a token in a query string. Greps for the dangerous forms;
      # genuine throwaways carry an explicit `# argv-ok:` marker.
      - name: Assert no credentials passed in argv
        run: bash scripts/checks/check_argv_secrets.sh

      # The five admin routers resolve on public DNS and are protected by exactly one
      # middleware. This asserts that middleware still resolves, that its type key
      # matches the pinned Traefik major version (ipWhiteList in v2 became
      # ipAllowList in v3 — a bump without the rename loses the allowlist silently),
      # and that no IP allowlist sits behind an authenticator.
      - name: Assert the edge middleware contract
        run: python3 scripts/checks/check_edge_middlewares.py

      # Guards the 2026-07-31 incident: minio.sh provisioned policies before
      # MinIO was serving, then blamed the credentials. Stubs docker, so it needs
      # no running stack.
      - name: MinIO readiness regression test
        run: bash scripts/checks/minio-readiness-test.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check script tests
        run: pip install pytest pyyaml && pytest tests/checks/ -v
