name: Validate Repository

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate markdown links
        run: python3 scripts/checks/check_md_links.py

      # h#758 (found by h#736's fix): wired only to its own bats control
      # since it was written. Genuinely hermetic — it counts rules in
      # platform/observability/prometheus/alerts.yml against the sentence in
      # CLAUDE.md, no network or live Prometheus needed (see its own
      # docstring, which explicitly designed it this way FOR CI). There was
      # no design question here, unlike h#738 — just a check that had never
      # been asked to run.
      - name: Assert CLAUDE.md's alert counts match the rules that ship
        run: python3 scripts/checks/check_alert_counts_documented.py

      # `-f service=auth` deployed all five services, because on a
      # workflow_dispatch paths-filter falls back to a parentless last commit
      # and reports the whole repo as changed. Hermetic — reads deploy.yml.
      - name: Assert a manual deploy targets one service
        run: python3 scripts/checks/check_dispatch_targets_one_service.py

      # #778: deploy-db and deploy-observability started at the same second and
      # raced on /opt/hill90/app; an hour later deploy-auth restarted Keycloak
      # underneath observability's login check. Hermetic — reads deploy.yml.
      - name: Assert no two deploy jobs can run at once
        run: python3 scripts/checks/check_deploy_jobs_serialized.py

      # sops and age (age-keygen) are needed by tests/scripts/common-load-secrets-
      # exit-status-control.bats, which forces a REAL sops decrypt failure
      # against a genuine mismatched age key rather than a mocked sops binary
      # — per review, that's a stronger control than a stub for the widest-
      # reaching instance of this repo's pipeline-exit-status defect family.
      #
      # The sops install below is copied from audit-hill90-ui-client.yml's
      # "Setup SOPS/age" step rather than reinvented: same version (a version
      # mismatch here would test load_secrets against a sops the estate does
      # not run — the same argument this repo already makes for pinning
      # promtool to the deployed Prometheus version), same -fsSL (without -f,
      # curl exits 0 on a 404 and writes the error page to /tmp/sops, which
      # is exactly the fetch-fails-reporting-success shape this PR fixes,
      # landing in the very step added to test it), and the same HTML-body
      # check. `age` (for age-keygen) is this workflow's own addition — the
      # sibling step doesn't need it, since it uses a real deployed key from
      # secrets rather than generating throwaway keypairs.
      - name: Install bats, sops and age
        env:
          SOPS_VERSION: '3.9.4'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats age

          SOPS_URL="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/sops "$SOPS_URL"
          if file /tmp/sops | grep -q "HTML"; then
            echo "::error::SOPS download returned HTML instead of binary — check URL: $SOPS_URL"
            exit 1
          fi
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Run bats tests
        run: bats tests/scripts/

      - name: Validate compose files
        # Credentials that must never fall back to a default use ${VAR:?...},
        # so `config` refuses to render without them. That guard is deliberate:
        # an empty MinIO root password silently starts the server on
        # minioadmin/minioadmin with only a WARN. Supply throwaway values here —
        # this step validates STRUCTURE, not secrets.
        #
        # Sibling-drift sweep: minio.yml was the only prod compose file using
        # this pattern; auth.yml, db.yml and observability.yml had the
        # identical bare-${VAR} shape for equally sensitive values (Keycloak's
        # own admin bootstrap credential among them) with no guard at all.
        # Extended to match — see those files' own :? messages for the full
        # list. Every var below is verified populated in the current SOPS
        # store before this landed, so this only changes what happens on a
        # FUTURE missing secret, not today's deploy.
        env:
          MINIO_ROOT_USER: placeholder
          MINIO_ROOT_PASSWORD: placeholder
          MINIO_OIDC_CLIENT_SECRET: placeholder
          DB_USER: placeholder
          DB_PASSWORD: placeholder
          KC_ADMIN_USERNAME: placeholder
          KC_ADMIN_PASSWORD: placeholder
          VAULT_OIDC_CLIENT_SECRET: placeholder
          GRAFANA_ADMIN_PASSWORD: placeholder
          GRAFANA_OIDC_CLIENT_SECRET: placeholder
        run: |
          for f in deploy/compose/prod/docker-compose*.yml; do
            echo "Validating $f..."
            docker compose -f "$f" config > /dev/null
          done

      - name: Validate Traefik config
        run: bash scripts/validate.sh traefik

      # Pinned to the deployed Prometheus version, because promtool's rule
      # semantics are what production will apply — testing against a different
      # version tests a different engine.
      - name: Validate and unit-test Prometheus alert rules
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.3.1 \
            check rules platform/observability/prometheus/alerts.yml
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.3.1 \
            test rules tests/prometheus/alerts_test.yml
          echo
          echo "NOTE: a green run here does NOT prove these rules can fire."
          echo "The unit tests supply their own input series, so a rule matching"
          echo "a label production never emits still passes. That is checked"
          echo "against the live Prometheus by:"
          echo "  python3 scripts/checks/check_alert_series.py   (run on the VPS)"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: shellcheck --severity=error scripts/*.sh

      # h#732 found the dormant 0==0 trap on the second check below (if
      # deploy.sh's invocation style is ever renamed, the grep for "docker
      # compose" matches zero lines and the check finds nothing to complain
      # about — an unchecked invariant, not an upheld one). Fixing it
      # surfaced something more severe in the SAME lines: GitHub Actions
      # runs `run:` blocks under `bash -eo pipefail`, and bash's `set -e`
      # explicitly EXEMPTS a `!`-negated command from triggering abort, even
      # when the negated result is failure. `! (pipeline)` never aborted
      # this step on a real violation — it just fell through to the next
      # line, and the step always ended on the final `echo`'s exit 0.
      # Verified directly, not by reasoning about bash semantics alone:
      # injected a real `docker compose ... ` call with no -p flag into a
      # copy of deploy.sh and ran this exact step, byte for byte, under
      # `bash -eo pipefail` — it printed "All safety checks passed." and
      # exited 0. Both checks are rewritten with an explicit if/exit so a
      # real violation actually fails the step, which the `!`-negated form
      # could not do regardless of the 0==0 trap.
      - name: Assert deploy safety invariants
        run: |
          echo "Checking: no --remove-orphans..."
          if grep -- "--remove-orphans" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#" | grep -q .; then
            echo "::error::scripts/deploy.sh contains --remove-orphans"
            grep -n -- "--remove-orphans" scripts/deploy.sh | grep -v "^#"
            exit 1
          fi

          echo "Checking: all docker compose calls use -p..."
          DC_LINES=$(grep "docker compose" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#" || true)
          if [ -z "$DC_LINES" ]; then
            echo "::error::CANNOT DETERMINE — zero 'docker compose' invocations found in scripts/deploy.sh. Either the invocation pattern changed (renamed, wrapped, hyphenated) and this check is no longer looking at anything real, or deploy.sh itself changed shape. Fix this check before trusting a green run here."
            exit 1
          fi
          if printf '%s\n' "$DC_LINES" | grep -v -- "-p " > /dev/null; then
            echo "::error::a docker compose invocation in scripts/deploy.sh is missing -p"
            printf '%s\n' "$DC_LINES" | grep -v -- "-p "
            exit 1
          fi
          echo "  ok — $(printf '%s\n' "$DC_LINES" | grep -c .) docker compose invocation(s), all use -p"

          echo "All safety checks passed."

      - name: Assert compose volume naming
        run: python3 scripts/checks/check_volume_names.py

      - name: Validate local/prod config surface
        run: python3 scripts/checks/check_env_surface.py

      - name: Assert every referenced OIDC client is created on the deploy path
        run: python3 scripts/checks/check_oidc_clients_reconciled.py

      # h#758 (found by h#736's fix): wired only to its own bats/pytest
      # control since it was written. Fully hermetic — parses
      # platform/auth/keycloak/platform-realm.json statically, no live
      # Keycloak needed, no design question about WHERE it can run. Pins
      # the tenant's authorization shape against exactly the regression
      # class that produced hill90-app#306/#704: hill90-ui losing its
      # `basic` client scope (no `sub` claim, every login refused) or its
      # `roles` scope (every permission check silently empty), or gaining a
      # realm-roles mapper it must never have (a client-admin inheriting
      # infrastructure-admin).
      - name: Assert the realm's tenant clients match the shape production runs
        run: python3 scripts/checks/check_realm_tenant_clients.py

      # h#727: static mode (no --live) is explicitly documented in the
      # script's own module docstring as "static, CI" — this wires that
      # documented, secrets-free half in. It cannot see holders (needs the
      # live realm), so it cannot replace --live; it catches the config-file
      # half of the same property on every PR: a retired role must not be
      # (re)created in keycloak.sh, or named in MinIO's policy list,
      # Grafana's role_attribute_path, or OpenBao's bound_claims.
      #
      # --live is NOT wired here, or anywhere yet, and that is a deliberate
      # stop rather than an oversight: it hardcodes `ssh vps <cmd>` — an SSH
      # config alias literal — and no workflow in this repo defines a "vps"
      # host alias; every other workflow reaches the VPS via
      # `ssh -i ~/.ssh/vps_key ... deploy@$TAILSCALE_IP` directly, with no
      # alias at all. Wiring --live needs either a new alias-setup step here
      # (a real design decision, not obviously the right one — it duplicates
      # what every other workflow already does differently) or refactoring
      # the script to accept an explicit SSH target instead of a hardcoded
      # alias, and validating either path end-to-end needs a real run against
      # production Keycloak/MinIO with decrypted secrets, out of scope for
      # this change. See h#738 for what's left.
      - name: Assert no retired role is granted anything (static)
        run: python3 scripts/checks/check_retired_roles_ungranted.py

      # h#758 (found by h#736's fix): wired only to its own bats control
      # since it was written. Fully hermetic — parses
      # docker-compose.observability.yml and scripts/vault.sh statically for
      # role-mapping expressions, no live Keycloak needed, no design question
      # about WHERE it can run. Guards the exact half-repoint shape from
      # #637/#666: Grafana's role_attribute_path had its admin arm repointed
      # from the zero-holder legacy role to platform-admin, but its editor arm
      # was left naming another zero-holder role — and because
      # role_attribute_strict defaults to false, that arm fails silently, with
      # no log line and no failed login to notice it by.
      - name: Assert no consumer role mapping still names a legacy realm role
        run: python3 scripts/checks/check_role_mappings_repointed.py

      - name: Assert no path revokes root before OIDC is enabled
        run: python3 scripts/checks/check_vault_revoke_order.py

      # Found in an error-path sweep: three workflows' "revert the host's
      # SOPS checkout" cleanup step ran unconditionally (always()), including
      # when the copy-back it depends on had already failed — discarding the
      # only copy of freshly-written secret material before it was ever
      # captured off-host. Wired only to its own bats control since it was
      # written; fully hermetic, no vault, no host.
      - name: Assert vault workflow cleanup steps don't discard un-captured secrets
        run: python3 scripts/checks/check_vault_cleanup_guard.py

      # h#758 (found by h#736's fix): wired only to its own bats control
      # since it was written. Fully hermetic — parses scripts/_common.sh and
      # scripts/vault.sh statically, no vault, no host. Same shape as
      # check_alert_counts_documented.py above: no design question about
      # WHERE this can run, just a check that had never been asked to.
      # Ties vault_paths_for_service() (what deploy time reads secrets from)
      # to cmd_seed() (what actually writes them) — the drift underneath the
      # 2026-08-03 auth outage (#495 removed a seed block, #531 restored the
      # declaration but not the seed, and nothing compared the two for
      # months).
      - name: Assert every declared vault path is seeded
        run: python3 scripts/checks/check_declared_paths_are_seeded.py

      # h#726: written to catch the exact regression in run 30791332461 (a
      # revoke step's `if:` ANDed with success() skipped it on failure and
      # left a live root token on production), then never invoked — the
      # detection logic was proven only against synthetic bats fixtures,
      # never against this repo's real workflow files. Static and read-only:
      # parses .github/workflows/*.yml from the checkout, no vault, no SSH,
      # no secret. Verified before wiring, against a mutated copy of the
      # real vault-regain-root.yml with the exact historical condition
      # reintroduced: goes red, correctly, on both the revoke-step and the
      # confirm-step half of the property.
      - name: Assert a root-minting workflow revokes and confirms on failure
        run: python3 scripts/checks/check_root_revoke_fails_closed.py

      # h#728: this ran advisory-only (STRICT=0) since it was added — real
      # warnings were printed but never failed the build. Flipped to strict
      # after establishing, not assuming, that it costs nothing today: ran
      # in strict mode against the real repo (zero findings, and confirmed
      # that's a genuine clean by checking the comparison counts — 43
      # compose refs, 38 SOPS keys, 22+4+2+5 schema entries — not an
      # empty-input vacuous pass), confirmed strict and non-strict report
      # IDENTICAL warning content and differ ONLY in the trailing "Strict
      # mode: failing" line and exit code (diffed both against a real
      # injected violation), and positive-controlled the flip itself against
      # a real compose-file mutation: an undeclared ${VAR} added to
      # docker-compose.infra.yml turned this red, reverting it turned this
      # green. See h#728's PR and issue comment for the full inventory. Does
      # NOT cover drift between infra/secrets/prod.enc.env and its own
      # .example template — this check reads only the checked-in example,
      # never the encrypted store.
      - name: Validate secrets schema consistency
        env:
          SECRETS_SCHEMA_STRICT: "1"
        run: python3 scripts/checks/check_secrets_schema.py

      - name: Assert no destructive volume commands
        run: bash scripts/checks/check_destructive_commands.sh

      # A credential in argv is readable by any local user via `ps` — the shell
      # analogue of a token in a query string. Greps for the dangerous forms;
      # genuine throwaways carry an explicit `# argv-ok:` marker.
      - name: Assert no credentials passed in argv
        run: bash scripts/checks/check_argv_secrets.sh

      # The five admin routers resolve on public DNS and are protected by exactly one
      # middleware. This asserts that middleware still resolves, that its type key
      # matches the pinned Traefik major version (ipWhiteList in v2 became
      # ipAllowList in v3 — a bump without the rename loses the allowlist silently),
      # and that no IP allowlist sits behind an authenticator.
      - name: Assert the edge middleware contract
        run: python3 scripts/checks/check_edge_middlewares.py

      # Guards the 2026-07-31 incident: minio.sh provisioned policies before
      # MinIO was serving, then blamed the credentials. Stubs docker, so it needs
      # no running stack.
      - name: MinIO readiness regression test
        run: bash scripts/checks/minio-readiness-test.sh

      # h#758 (found by h#736's fix): this script's only caller was
      # tests/checks/test_realm_tenant_serves.py, a pytest wrapper — and
      # `pytest tests/checks/` running in CI is still not this SCRIPT being
      # invoked for real, only the wrapper's own assertions about it (see
      # check_checks_are_wired.py's docstring on why TEST_SOURCES never
      # counts). No design question about placement, unlike
      # check_vault_covers_compose.py (h#758 6/8): this builds and destroys
      # its OWN throwaway Keycloak container — it never touches a running
      # stack, the VPS, or any live secret. The only credentials involved are
      # literal throwaways the script defines itself (see its own argv-ok
      # comments). It needs only Docker, already used elsewhere in this same
      # job (promtool above, minio-readiness-test.sh right above this step).
      # Proves what check_realm_tenant_clients.py (h#758 3/8) cannot: that
      # file shows platform-realm.json is SHAPED correctly, this shows
      # Keycloak actually EMITS the claim the app reads —
      # resource_access.hill90-ui.roles — which depends on built-in client
      # scopes this repo does not define, so only a real Keycloak can answer.
      - name: Prove the platform realm actually serves the tenant
        run: bash scripts/checks/realm-tenant-serves-test.sh

      # h#835: hill90-ui's client secret is deliberately NOT guarded at the
      # compose level (fad9fefa — it is legitimately unset on every routine
      # auth deploy after the first import), so a first import running with
      # it unset succeeds silently and installs the literal, unsubstituted
      # string "${HILL90_UI_CLIENT_SECRET}" as the client secret fronting
      # hill90.com — readable in this PUBLIC repo's own platform-realm.json.
      # Same shape as the step above: builds and destroys its own throwaway
      # Keycloak containers, only Docker required, no live secret involved.
      - name: Prove a realm-import substitution failure is caught, not silently installed
        run: bash scripts/checks/realm-secret-substitution-test.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check script tests
        run: pip install pytest pyyaml && pytest tests/checks/ -v

      # h#758 (found by h#736's fix): wired only to its own bats control
      # since it was written. Fully hermetic — parses scripts/*.sh and
      # .github/workflows/*.yml statically for the two machine-detectable
      # silent-success shapes (a fallback subshell swallowing a failed call;
      # a cleanup/assertion step's `if:` skipping on failure), no live host
      # needed. Placed after the pyyaml install above because it imports
      # `yaml` to parse workflow files. No design question about WHERE it
      # can run — just a check that had never been asked to. This is the
      # same script used throughout h#758's own investigation as the
      # regression detector for new `if:` conditions on other steps; wiring
      # its own execution here is a separate question from using it as a
      # tool, and was open until now.
      - name: Sweep for operations that fail and report success
        run: python3 scripts/checks/check_silent_success.py

      # Hill90#736: this checker's own bats control
      # (tests/scripts/checks-are-wired-control.bats) used to be its only
      # caller — which, after that fix, is exactly the TEST-ONLY outcome
      # this file exists to catch. A bats control proves the checker's
      # LOGIC works against a fabricated fixture; it does not prove
      # anything runs the checker for real. This step is that real caller.
      - name: Every check must be invoked by something real
        run: python3 scripts/checks/check_checks_are_wired.py
