name: Validate Repository

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate markdown links
        run: python3 scripts/checks/check_md_links.py

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/scripts/

      - name: Validate compose files
        # Credentials that must never fall back to a default use ${VAR:?...},
        # so `config` refuses to render without them. That guard is deliberate:
        # an empty MinIO root password silently starts the server on
        # minioadmin/minioadmin with only a WARN. Supply throwaway values here —
        # this step validates STRUCTURE, not secrets.
        env:
          MINIO_ROOT_USER: placeholder
          MINIO_ROOT_PASSWORD: placeholder
          MINIO_OIDC_CLIENT_SECRET: placeholder
        run: |
          for f in deploy/compose/prod/docker-compose*.yml; do
            echo "Validating $f..."
            docker compose -f "$f" config > /dev/null
          done

      - name: Validate Traefik config
        run: bash scripts/validate.sh traefik

      # Pinned to the deployed Prometheus version, because promtool's rule
      # semantics are what production will apply — testing against a different
      # version tests a different engine.
      - name: Validate and unit-test Prometheus alert rules
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.3.1 \
            check rules platform/observability/prometheus/alerts.yml
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.3.1 \
            test rules tests/prometheus/alerts_test.yml
          echo
          echo "NOTE: a green run here does NOT prove these rules can fire."
          echo "The unit tests supply their own input series, so a rule matching"
          echo "a label production never emits still passes. That is checked"
          echo "against the live Prometheus by:"
          echo "  python3 scripts/checks/check_alert_series.py   (run on the VPS)"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: shellcheck --severity=error scripts/*.sh

      - name: Assert deploy safety invariants
        run: |
          echo "Checking: no --remove-orphans..."
          ! (grep -- "--remove-orphans" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#")

          echo "Checking: all docker compose calls use -p..."
          ! (grep "docker compose" scripts/deploy.sh | grep -v "^#" | grep -v "^[[:space:]]*#" | grep -v -- "-p ")

          echo "All safety checks passed."

      - name: Assert compose volume naming
        run: python3 scripts/checks/check_volume_names.py

      - name: Validate local/prod config surface
        run: python3 scripts/checks/check_env_surface.py

      - name: Assert every referenced OIDC client is created on the deploy path
        run: python3 scripts/checks/check_oidc_clients_reconciled.py

      - name: Assert no path revokes root before OIDC is enabled
        run: python3 scripts/checks/check_vault_revoke_order.py

      - name: Validate secrets schema consistency
        env:
          SECRETS_SCHEMA_STRICT: "0"
        run: python3 scripts/checks/check_secrets_schema.py

      - name: Assert no destructive volume commands
        run: bash scripts/checks/check_destructive_commands.sh

      # A credential in argv is readable by any local user via `ps` — the shell
      # analogue of a token in a query string. Greps for the dangerous forms;
      # genuine throwaways carry an explicit `# argv-ok:` marker.
      - name: Assert no credentials passed in argv
        run: bash scripts/checks/check_argv_secrets.sh

      # The five admin routers resolve on public DNS and are protected by exactly one
      # middleware. This asserts that middleware still resolves, that its type key
      # matches the pinned Traefik major version (ipWhiteList in v2 became
      # ipAllowList in v3 — a bump without the rename loses the allowlist silently),
      # and that no IP allowlist sits behind an authenticator.
      - name: Assert the edge middleware contract
        run: python3 scripts/checks/check_edge_middlewares.py

      # Guards the 2026-07-31 incident: minio.sh provisioned policies before
      # MinIO was serving, then blamed the credentials. Stubs docker, so it needs
      # no running stack.
      - name: MinIO readiness regression test
        run: bash scripts/checks/minio-readiness-test.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check script tests
        run: pip install pytest pyyaml && pytest tests/checks/ -v
