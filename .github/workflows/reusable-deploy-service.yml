name: Reusable Deploy Service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Setup SOPS/age for secrets
        env:
          SOPS_VERSION: "3.9.4"
        run: |
          SOPS_URL="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/sops "$SOPS_URL"
          # Verify we got a binary, not an HTML error page
          if file /tmp/sops | grep -q "HTML"; then
            echo "::error::SOPS download returned HTML instead of binary — check URL: $SOPS_URL"
            exit 1
          fi
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          sops --version

          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Get Tailscale IP from secrets
        id: get-ip
        run: |
          TAILSCALE_IP=$(sops -d --extract '["TAILSCALE_IP"]' infra/secrets/prod.enc.env)
          echo "::add-mask::$TAILSCALE_IP"
          echo "tailscale_ip=$TAILSCALE_IP" >> $GITHUB_OUTPUT

      - name: Verify SSH connectivity
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} 'echo "SSH connection successful"'

      # The preflight is a GUARD, so it runs from THIS checkout, piped over ssh —
      # not from the copy lying on the VPS.
      #
      # It used to run the host's copy, which is the copy `git reset --hard` has
      # not updated yet, so the guard protecting a deploy was always one deploy
      # older than the deploy it protected: a fix landed in scripts/preflight-
      # checkout.sh could not reach production until a deploy succeeded, and the
      # only thing standing between the host and a successful deploy was the
      # unfixed guard. hill90-app hit this first (app#139) and its fix is ported
      # here, to all five sites that run this preflight — not just this one.
      #
      # `bash -s` runs the script we just checked out, on the host, in the
      # checkout directory. It sources nothing and does not read $0, so stdin
      # execution is equivalent to running the file. This also removes the old
      # "preflight-checkout.sh is missing from the box" guard entirely: that
      # failure mode existed only because the host's own copy was being invoked,
      # and running the runner's copy over stdin cannot fail that way.
      - name: Checkout preflight (this repo's copy, not the host's)
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "cd /opt/hill90/app && git fetch origin && git diff --stat HEAD origin/main"
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "cd /opt/hill90/app && bash -s" < scripts/preflight-checkout.sh

      - name: Deploy ${{ inputs.service }}
        run: |
          # deploy.sh automatically runs pre-deploy backup for stateful services
          # (vault, observability) before the down/up cycle.
          echo "Deploying ${{ inputs.service }}..."
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "cd /opt/hill90/app && \
             git reset --hard origin/main && \
             export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && \
             bash scripts/deploy.sh ${{ inputs.service }} prod"

      - name: Verify readiness
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "cd /opt/hill90/app && bash scripts/deploy.sh verify ${{ inputs.service }}"

      # PROVE VAULT ACTUALLY CARRIES EVERY SECRET THE COMPOSE FILE NEEDS.
      #
      # h#758 (found by h#736's fix): wired only to its own bats/pytest control
      # since it was written. Genuinely NOT hermetic, unlike checks 1-5/8 in
      # this same series — it calls `sops -d` on the real encrypted store to
      # read SOPS key NAMES (never values), which is the same distinction the
      # rest of this series draws between "no design question" and "needed a
      # real one" (h#727/h#738). ci.yml has no age key anywhere (confirmed: no
      # `sops`/`SOPS_AGE_KEY` reference exists in it at all), and the check's
      # own bats control (tests/scripts/vault-covers-compose-control.bats)
      # already SKIPS rather than fails when no key is present — proof this
      # cannot run there. It CAN run here: /opt/hill90/secrets/keys/keys.txt
      # already exists on the VPS for every deploy, and is the check's own
      # second candidate key path (see sops_key_names() in the check itself) —
      # no new secret, no new access, the exact shape --live --local took in
      # h#738.
      #
      # AFTER the deploy, not before, so the checkout this reads from is the
      # one `git reset --hard origin/main` just made current — same reason
      # "Checkout preflight" above stopped running the host's stale copy.
      # Placing it earlier would mean checking the PREVIOUS deploy's files.
      # This means it detects the #665 outage class immediately after a bad
      # deploy rather than preventing it outright; blocking it beforehand
      # would mean rewriting the single SSH command in "Deploy
      # ${{ inputs.service }}" above, which is deploy-mechanics work, not
      # wiring a check, and is out of scope here.
      #
      # UNGATED BY inputs.service, unlike the checks below: this one examines
      # every prod compose file in one pass regardless of which service
      # triggered the run, so it runs on every deploy.
      #
      # success(), same reasoning as every "Prove ..." step below: verifying a
      # deploy that did not happen proves nothing.
      - name: Prove vault carries every secret the compose files need
        if: success()
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && python3 scripts/checks/check_vault_covers_compose.py'

      # PROVE SSO STILL WORKS, not just that the container is healthy.
      #
      # On 2026-08-03 an observability deploy started Grafana with an empty
      # GRAFANA_OIDC_CLIENT_SECRET. The container was healthy, `deploy.sh verify`
      # passed, the local admin login still worked — and every SSO login failed
      # with `unauthorized_client` at token exchange. Nothing in this workflow
      # could see it, and nothing did for the rest of the deploy.
      #
      # scripts/checks/grafana-role-login-test.sh was written that day to prove
      # the opposite case and then wired to NOTHING. It sat in the tree
      # referenced by no workflow, no test and no runbook — a guard that cannot
      # fail because it never runs, which is the same defect as a check that
      # reports success without looking. This is it being connected.
      #
      # testuser01 rather than a real person: it drives a full authorization-code
      # flow and creates a genuine Keycloak login event, and the account exists
      # for exactly this. Viewer is its correct role with no platform-editor
      # grant, so a wrong answer here means the mapping or the exchange broke,
      # not that someone's permissions changed.
      #
      # ON THE CONDITION, because this file now contains both shapes: `success()`
      # is CORRECT for a verification. A cleanup must run when the run fails —
      # that was #663 — but verifying a deploy that did not happen proves nothing
      # and would fail for the wrong reason. Cleanup needs always(); verification
      # needs success().
      # PROVE NO MINIO POLICY IS NAMED AFTER AN AUTOMATIC REALM ROLE.
      #
      # MinIO grants the UNION of every claim value that names a policy. Three
      # values ride in EVERY token in realm `platform` — offline_access,
      # uma_authorization and default-roles-platform — because Keycloak grants
      # them to every account. So a MinIO policy named after any of those is
      # granted to everyone who can log in, with nobody having asked for it.
      #
      # Demonstrated rather than theorised in #655: policies called
      # uma_authorization and offline_access gave `jon` list and write purely for
      # being a realm member.
      #
      # minio.sh apply prints "Verify with: …minio-policy-names-test.sh" after it
      # runs. That is a sentence, not a call — the check was invoked by nothing
      # (#689) and had been since it was written. This is it being connected, the
      # same way #688 connected the Grafana SSO check.
      #
      # `success()` for the same reason as that one: this VERIFIES a deploy, and
      # verifying a deploy that did not happen proves nothing. Cleanup needs
      # always(); verification needs success().
      - name: Prove no MinIO policy collides with an automatic realm role
        if: success() && inputs.service == 'minio'
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && bash scripts/checks/minio-policy-names-test.sh'

      # PROVE NO RETIRED ROLE IS GRANTED ANYTHING, ON THE LIVE ESTATE.
      #
      # ci.yml already runs this check statically on every PR (no --live) — that
      # half catches a retired role named in keycloak.sh, MinIO's policy list,
      # Grafana's role_attribute_path, or OpenBao's bound_claims. It cannot see
      # HOLDERS: a role removed from keycloak.sh but never actually deleted from
      # the live realm, or a MinIO policy created out-of-band with `mc`. Only
      # --live measures those, and --live had no caller anywhere (h#738) —
      # `live_checks()` shelled out via `ssh vps <cmd>`, a literal SSH CONFIG
      # ALIAS that only resolves on a workstation with `Host vps` in its own
      # ~/.ssh/config. No workflow in this repo ever establishes that alias,
      # which is the actual reason nothing could wire it in: not a missing
      # step, a transport this repo's workflows do not use.
      #
      # --local (h#738) is the fix: it runs the same measurement directly, no
      # extra SSH hop, once this step has already SSH'd onto the VPS — the
      # exact shape the MinIO check immediately above already relies on.
      #
      # GATED ON auth OR minio, not every deploy: those are the two services
      # that can move a role's grants (Keycloak realm roles themselves, and the
      # MinIO policies a role's claim can now collide with). observability and
      # db deploys cannot change either.
      #
      # exit 2 (CANNOT DETERMINE) fails this step same as exit 1 — `run:` fails
      # on any non-zero exit — which is deliberate: an unreachable host must
      # never be read as "no retired role is granted", the null result that
      # agrees with what everyone hopes is true. See h#727.
      #
      # success(), same reasoning as the MinIO check above it: verifying a
      # deploy that did not happen proves nothing. Cleanup needs always();
      # verification needs success().
      - name: Prove no retired role is granted anything, on the live estate
        if: success() && (inputs.service == 'auth' || inputs.service == 'minio')
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && python3 scripts/checks/check_retired_roles_ungranted.py --live --local'

      # PROVE EVERY ALERT RULE CAN ACTUALLY MATCH A SERIES.
      #
      # A rule can be health=ok and still never fire, if its selector names a
      # label or metric production does not emit. Two shipped that way. promtool
      # cannot catch it because the test author supplies the labels — only the
      # live Prometheus can, which is why this runs here and not in CI.
      #
      # ci.yml:66 ECHOES "python3 scripts/checks/check_alert_series.py (run on
      # the VPS)" as a reminder. It therefore appears in every CI log while never
      # executing — the check CONTRIBUTING credits with "independently
      # rediscovering the two rules already known to be unfireable" ran only when
      # somebody remembered (#689). This connects it.
      #
      # The check fails closed on its own: if Prometheus is unreachable it prints
      # "A check that cannot run must not report success" and exits 1, so a
      # network problem cannot be mistaken for a clean result.
      #
      # success(), as with the two verifications below it: verifying a deploy
      # that did not happen proves nothing. Cleanup needs always().
      - name: Prove every alert rule matches a live series
        if: success() && inputs.service == 'observability'
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && python3 scripts/checks/check_alert_series.py'

      - name: Prove Grafana SSO still yields the expected role
        if: success() && inputs.service == 'observability'
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && bash scripts/checks/grafana-role-login-test.sh testuser01 Viewer'

      # Hill90#792. This step ran clean on every auth deploy and signalled
      # nothing: `with:` carried only event-type, so `repository` defaulted
      # to THIS repo (Hill90 has no listener — smoke-auth.yml lives in
      # hill90-app), and `token` defaulted to GITHUB_TOKEN, whose dispatches
      # do not trigger workflow runs at all (GitHub's own recursion guard).
      # Either alone was fatal; both were true.
      #
      # HILL90_APP_DISPATCH_TOKEN must exist as a repository secret on THIS
      # repo (Hill90 — the sender) before this can fire anything, and
      # GITHUB_TOKEN cannot stand in for it regardless of permissions
      # granted to this workflow, by the recursion guard above. It needs to
      # be a token that can trigger a workflow run in jonhill90/hill90-app —
      # a fine-grained PAT scoped to that repository with "Actions:
      # read and write", or a classic PAT with the `repo` scope. Until that
      # secret is created, this step will fail loudly (a missing secret
      # renders empty, and repository-dispatch@v3 errors on an empty
      # token) rather than silently doing nothing — a real regression from
      # today's silent no-op only in the sense that a loud failure is the
      # correct state for missing wiring, not a worse one.
      # GATED ON THE SECRET, not hard-failing without it — and the reason is
      # a change made the same day, not caution for its own sake. The deploy
      # jobs are now SERIALISED (h#781): db -> auth -> minio -> vault ->
      # observability, each downstream job carrying `!failure()`. A step that
      # failed here would turn deploy-auth red on a run where auth itself
      # deployed fine, and skip minio, vault and observability behind it — a
      # missing secret would take out the remainder of every multi-service
      # deploy.
      #
      # This matches the `Notify deploy result` step below, which solves the
      # identical problem (an optional outbound integration that must not
      # fail the deploy when unconfigured) with the same env-gated `if:`.
      # `env`, not `secrets`, because the secrets context is not reliably
      # available in a step-level conditional.
      #
      # A SKIPPED step is not the defect this PR removes. The original sin
      # was a step that RAN, exited 0, and reported success while signalling
      # nothing. Skipped-with-a-warning is visibly different from that.
      - name: Signal post-deploy hooks
        if: success() && inputs.service == 'auth' && env.DISPATCH_TOKEN != ''
        env:
          DISPATCH_TOKEN: ${{ secrets.HILL90_APP_DISPATCH_TOKEN }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HILL90_APP_DISPATCH_TOKEN }}
          repository: jonhill90/hill90-app
          event-type: deploy-auth-success

      - name: Warn that the post-deploy signal is unwired
        if: success() && inputs.service == 'auth' && env.DISPATCH_TOKEN == ''
        env:
          DISPATCH_TOKEN: ${{ secrets.HILL90_APP_DISPATCH_TOKEN }}
        run: |
          echo "::warning::HILL90_APP_DISPATCH_TOKEN is not set on this repository — hill90-app's smoke-auth.yml was NOT triggered. Production auth is unverified by this deploy. See Hill90#792."

      - name: Notify deploy result
        if: always() && env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI="✅"
          if [ "$STATUS" != "success" ]; then
            EMOJI="❌"
          fi

          curl -sf -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "service": "${{ inputs.service }}",
              "status": "'"$STATUS"'",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "text": "'"$EMOJI"' Deploy **${{ inputs.service }}** — '"$STATUS"' ('"${{ github.sha }}"')"
            }' || echo "Warning: webhook notification failed (non-blocking)"

      # h#816: the same shape as "Warn that the post-deploy signal is
      # unwired" above, for the same reason — an optional notification that
      # is unconfigured skipped in total silence, indistinguishable in the
      # run log from a deploy that genuinely had nothing to report. That
      # silence cost three days on 2026-08-03: vault-sync-to-sops failed and
      # nobody knew until h#712's Prometheus rule shipped two days later
      # (#789). Copying the established pattern rather than inventing one.
      - name: Warn that deploy result notification is unwired
        if: always() && env.DEPLOY_WEBHOOK_URL == ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "::warning::DEPLOY_WEBHOOK_URL is not set on this repository — the deploy result for ${{ inputs.service }} was NOT sent anywhere. See Hill90#816."
