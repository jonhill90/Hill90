name: Deploy Changed Services (Prod)

on:
  push:
    branches: [main]
    paths:
      - 'platform/observability/**'
      - 'deploy/compose/prod/docker-compose.vault.yml'
      - 'deploy/compose/prod/docker-compose.observability.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or "all")'
        type: choice
        options: [all, vault, observability]
        default: 'all'

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # --- Change detection ---
  changes:
    runs-on: ubuntu-latest
    outputs:
      vault: ${{ steps.filter.outputs.vault }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vault:
              - 'deploy/compose/prod/docker-compose.vault.yml'
            observability:
              - 'deploy/compose/prod/docker-compose.observability.yml'
              - 'platform/observability/**'

  # --- Platform layer ---

  deploy-vault:
    needs: [changes]
    if: needs.changes.outputs.vault == 'true' || github.event.inputs.service == 'all' || github.event.inputs.service == 'vault'
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      service: vault
    secrets: inherit

  deploy-observability:
    needs: [changes]
    if: needs.changes.outputs.observability == 'true' || github.event.inputs.service == 'all' || github.event.inputs.service == 'observability'
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      service: observability
    secrets: inherit
