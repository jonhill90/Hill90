name: Deploy Changed Services (Prod)

on:
  push:
    branches: [main]
    paths:
      - 'platform/auth/keycloak/**'
      - 'platform/data/postgres/**'
      - 'platform/observability/**'
      - 'deploy/compose/prod/docker-compose.db.yml'
      - 'deploy/compose/prod/docker-compose.minio.yml'
      - 'deploy/compose/prod/docker-compose.auth.yml'
      - 'deploy/compose/prod/docker-compose.vault.yml'
      - 'deploy/compose/prod/docker-compose.observability.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or "all")'
        type: choice
        options: [all, db, auth, minio, vault, observability]
        default: 'all'

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # --- Change detection ---
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      auth: ${{ steps.filter.outputs.auth }}
      minio: ${{ steps.filter.outputs.minio }}
      vault: ${{ steps.filter.outputs.vault }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - 'deploy/compose/prod/docker-compose.db.yml'
              - 'platform/data/postgres/**'
            auth:
              - 'deploy/compose/prod/docker-compose.auth.yml'
              - 'platform/auth/keycloak/**'
            minio:
              - 'deploy/compose/prod/docker-compose.minio.yml'
            vault:
              - 'deploy/compose/prod/docker-compose.vault.yml'
            observability:
              - 'deploy/compose/prod/docker-compose.observability.yml'
              - 'platform/observability/**'

  # --- Platform layer ---

  deploy-db:
    needs: [changes]
    if: needs.changes.outputs.db == 'true' || github.event.inputs.service == 'all' || github.event.inputs.service == 'db'
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      service: db
    secrets: inherit

  # Keycloak stores realms in Postgres, so it waits for the database.
  deploy-auth:
    needs: [changes, deploy-db]
    if: always() && (needs.changes.outputs.auth == 'true' || github.event.inputs.service == 'all' || github.event.inputs.service == 'auth') && !failure() && !cancelled()
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      service: auth
    secrets: inherit

  # MinIO validates OIDC tokens against Keycloak, so it follows auth. It does
  # not depend on it to START — a slow or absent IdP only affects federated
  # logins, never root-credential access.
  deploy-minio:
    needs: [changes, deploy-auth]
    if: always() && (needs.changes.outputs.minio == 'true' || github.event.inputs.service == 'all' || github.event.inputs.service == 'minio') && !failure() && !cancelled()
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      service: minio
    secrets: inherit

  deploy-vault:
    needs: [changes]
    if: needs.changes.outputs.vault == 'true' || github.event.inputs.service == 'all' || github.event.inputs.service == 'vault'
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      service: vault
    secrets: inherit

  deploy-observability:
    needs: [changes]
    if: needs.changes.outputs.observability == 'true' || github.event.inputs.service == 'all' || github.event.inputs.service == 'observability'
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      service: observability
    secrets: inherit
