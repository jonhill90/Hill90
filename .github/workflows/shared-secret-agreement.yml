name: Shared Secret Agreement

# Does testuser01's Keycloak password still agree between the two stores
# that each carry their own copy of it?
#
# Hill90#839. testuser01's password lives twice: here as TEST_USER_PASSWORD
# (infra/secrets/prod.enc.env), and in hill90-app as TESTUSER01_PASSWORD
# (infra/secrets/test-accounts.enc.env) — two repositories, two key names,
# nothing linking them. hill90-app#588 rotated it and updated only its own
# store; the next observability deploy's Grafana-role login check failed an
# hour later because scripts/checks/grafana-role-login-test.sh reads THIS
# repo's copy (repaired in #838). The rotation PR was correct on its own
# terms — the consumer was a different repository under a different name,
# and nothing compared them. This closes that gap, not the duplication
# itself: option 2 of the issue, kept as two stores with a check that they
# agree, chosen over a single shared store because the two repos have no
# shared secrets infrastructure to put one in.
#
# jon (JON_KC_PASSWORD) and hill90admin (HILL90ADMIN_KC_PASSWORD), the other
# two accounts grafana-role-login-test.sh knows about, are NOT covered here —
# checked directly against hill90-app's stores before writing this workflow,
# and neither key exists there. They are single-sourced in this repository,
# so there is nothing for them to diverge from.
#
# WHY NO NEW CROSS-REPO CREDENTIAL. hill90-app's own infra/secrets/.sops.yaml
# says so explicitly: "this repository's SOPS_AGE_KEY GitHub secret therefore
# holds a key that can also decrypt Hill90's store" — one age key per host,
# by deliberate design, not an accident. Verified directly against the VPS
# before relying on it, not merely read from that comment: the single key at
# /opt/hill90/secrets/keys/keys.txt decrypts both
# /opt/hill90/infra/secrets/prod.enc.env and
# /opt/hill90-app/infra/secrets/test-accounts.enc.env. So THIS repo's
# existing SOPS_AGE_KEY secret is already sufficient once hill90-app's store
# is checked out alongside it — matching this repo's stated preference for
# option 2 (works across the repo boundary without new infrastructure), which
# was tested rather than assumed after a different preferred option (app#579,
# the same day) turned out to violate a written invariant.
#
# NEVER prints either plaintext. check_shared_secret_agrees.py hashes both
# values inside the one process that holds them and only ever prints or logs
# the sha256 prefix.
#
# THE DECISION HAPPENS ON THE RUNNER — check_shared_secret_agrees.py itself,
# bats-equivalent (pytest) controlled at tests/checks/test_shared_secret_agrees.py
# with a genuinely divergent pair built from a throwaway age key, never a
# production key or secret — same shape as
# check_hill90_ui_secret_agreement.sh / hill90-ui-secret-agreement-control.bats
# in audit-hill90-ui-client.yml: a comparison that has only ever seen
# agreement has not been shown to notice disagreement.
#
# hill90-app IS PUBLIC (same reasoning tenant-baseline-agreement.yml
# documents), so the cross-repo checkout needs no token.
#
# WHY BOTH A PUSH TRIGGER AND A SCHEDULE, like tenant-baseline-agreement.yml.
# A push to infra/secrets/prod.enc.env here catches OUR side rotating; the
# daily schedule catches hill90-app rotating ITS side, which no push to this
# repo would ever see.

on:
  push:
    branches: [main]
    paths:
      - 'infra/secrets/prod.enc.env'
      - 'scripts/checks/check_shared_secret_agrees.py'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agree:
    name: testuser01 password agrees across repositories
    runs-on: ubuntu-latest
    # Only the heartbeat step below needs the VPS — the comparison itself is
    # a pure GitHub-side decrypt-and-compare, same asymmetry
    # tenant-baseline-agreement.yml documents for the identical reason.
    environment: production
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout hill90-app, for its copy of the password only
        uses: actions/checkout@v4
        with:
          repository: jonhill90/hill90-app
          path: tenant
          sparse-checkout: |
            infra/secrets/test-accounts.enc.env
          sparse-checkout-cone-mode: false

      - name: Setup SOPS/age
        env:
          SOPS_VERSION: '3.9.4'
        run: |
          SOPS_URL="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/sops "$SOPS_URL"
          if file /tmp/sops | grep -q "HTML"; then
            echo "::error::SOPS download returned HTML instead of binary — check URL: $SOPS_URL"
            exit 1
          fi
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Compare the two stores
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          python3 scripts/checks/check_shared_secret_agrees.py \
            --label testuser01 \
            --this-file infra/secrets/prod.enc.env --this-key TEST_USER_PASSWORD \
            --other-file tenant/infra/secrets/test-accounts.enc.env --other-key TESTUSER01_PASSWORD

      # h#839, same shape as the other four scheduled workflows' heartbeat —
      # a dead-man's-switch for the SCHEDULE reaching a verdict at all, not
      # for what the comparison found. `if: always()` so a real divergence
      # (already failing the step above, loudly) does not also make THIS
      # metric go stale hours later — the two answer different questions.
      - name: Preflight — required secrets are present, for the heartbeat below
        if: always()
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          missing=()
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET VPS_SSH_PRIVATE_KEY SOPS_AGE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Scheduled-workflow heartbeat cannot run: missing secret(s) ${missing[*]}. The comparison above is unaffected; this is the dead-man's-switch metric failing to record, not the comparison."
            exit 1
          fi

      - name: Setup Tailscale
        if: always()
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH key
        if: always()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Get Tailscale IP from secrets
        id: get-ip
        if: always()
        run: |
          TAILSCALE_IP=$(sops -d --extract '["TAILSCALE_IP"]' infra/secrets/prod.enc.env)
          if [ -z "$TAILSCALE_IP" ]; then
            echo "::error::TAILSCALE_IP is empty or absent in infra/secrets/prod.enc.env"
            exit 1
          fi
          echo "::add-mask::$TAILSCALE_IP"
          echo "tailscale_ip=$TAILSCALE_IP" >> $GITHUB_OUTPUT

      - name: Emit scheduled-workflow heartbeat
        if: always()
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "bash -s" <<'REMOTE'
          set -euo pipefail
          DIR=/opt/hill90/metrics/textfile_collector
          FILE="${DIR}/hill90_scheduled_workflow_shared-secret-agreement.prom"
          TMP="${DIR}/.hill90_scheduled_workflow_shared-secret-agreement.prom.tmp"
          mkdir -p "$DIR"
          TS=$(date +%s)
          {
            echo "# HELP hill90_scheduled_workflow_last_run_timestamp_seconds Unix time this scheduled workflow last reached a verdict (success or failure), regardless of what it decided"
            echo "# TYPE hill90_scheduled_workflow_last_run_timestamp_seconds gauge"
            echo "hill90_scheduled_workflow_last_run_timestamp_seconds{workflow=\"shared-secret-agreement\"} ${TS}"
          } > "$TMP"
          mv -f "$TMP" "$FILE"
          chmod 644 "$FILE"
          REMOTE
