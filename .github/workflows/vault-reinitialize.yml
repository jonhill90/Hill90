name: Vault Reinitialize (Prod)

# ROOT-TOKEN-DISPOSAL: deliberate — this workflow mints a root token and does NOT
# revoke it, by design. The "What is left to do" summary hands the operator the
# revoke command and says "Deliberately not automated", because on
# OpenBao >= 2.5.3 revoking is a one-way door and the whole point of a
# reinitialise is to leave the vault configurable while its behaviour is checked.
# Declared here so that scripts/checks/check_root_revoke_fails_closed.py sees a
# decision rather than an omission — a workflow that simply forgot still fails
# that check. See #662.

# The whole reinitialize decision as ONE action.
#
# docs/decisions/vault-vs-sops.md describes reinitializing as seven ordered
# steps, and JON-48 adds a storage migration that is only free at the moment the
# volume is wiped. Doing those by hand means getting the order right under
# pressure — and getting it wrong is what produced the current inert vault, by
# revoking root before anything had been configured.
#
# So this runs the whole sequence, in the order that works:
#
#   backup -> wipe -> redeploy (on raft) -> init -> unseal -> store key
#          -> setup -> seed -> setup-sync-token -> PR the new secrets
#
# Root is NOT revoked. Revoking before anything is configured is the mistake this
# workflow exists to avoid repeating, and it is left as a separate deliberate
# command printed at the end. (It was called a ONE-WAY door here until
# 2026-08-03; it is not — see vault-regain-root.yml — but it is expensive enough
# that the ordering still matters.)
#
# DESTRUCTIVE: it deletes the openbao-data volume. Three things stand in the
# way of that happening by accident:
#
#   1. A typed confirmation. The input must be exactly REINITIALIZE.
#   2. A data check. If the vault holds KV secrets, the run stops. A vault that
#      someone has since put real secrets into is never silently destroyed.
#   3. A backup. The volume is archived before anything is removed, and the run
#      aborts if that backup fails.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REINITIALIZE (exactly) to confirm. This DELETES the vault data volume.'
        required: true
        type: string
      switch_to_raft:
        description: 'Also move storage from the deprecated file backend to raft. Free to do now — the volume is being wiped anyway.'
        required: false
        default: true
        type: boolean
      i_have_read_the_decision_doc:
        description: 'Confirm you have read docs/decisions/vault-vs-sops.md and intend to reinitialize.'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  reinitialize:
    name: Reinitialize OpenBao
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ---- Guards, before anything is touched --------------------------------

      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "REINITIALIZE" ]; then
            echo "::error::Confirmation not matched. Type exactly: REINITIALIZE"
            exit 1
          fi
          if [ "${{ inputs.i_have_read_the_decision_doc }}" != "true" ]; then
            echo "::error::Read docs/decisions/vault-vs-sops.md first, then set the acknowledgement to true."
            exit 1
          fi
          echo "Confirmed. Storage target: ${{ inputs.switch_to_raft && 'raft (integrated storage)' || 'file (deprecated, removed in v2.7.0)' }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Setup SOPS/age for secrets
        env:
          SOPS_VERSION: "3.9.4"
        run: |
          SOPS_URL="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/sops "$SOPS_URL"
          if file /tmp/sops | grep -q "HTML"; then
            echo "::error::SOPS download returned HTML instead of binary — check URL: $SOPS_URL"
            exit 1
          fi
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Get Tailscale IP from secrets
        id: get-ip
        run: |
          TAILSCALE_IP=$(sops -d --extract '["TAILSCALE_IP"]' infra/secrets/prod.enc.env)
          echo "::add-mask::$TAILSCALE_IP"
          echo "tailscale_ip=$TAILSCALE_IP" >> $GITHUB_OUTPUT

      - name: Verify SSH connectivity
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} 'echo "SSH connection successful"'

      # The guard that matters. If the vault holds KV data, someone has put real
      # secrets in it since this decision was written, and wiping it would
      # destroy them. Refuse rather than assume.
      #
      # A root token on disk means the vault is configurable, so the data can be
      # enumerated directly. Without one the vault cannot be read at all — which
      # is the current state and is itself evidence it holds nothing usable —
      # but the backup below covers that case regardless.
      - name: Refuse if the vault holds data
        run: |
          IP=${{ steps.get-ip.outputs.tailscale_ip }}
          HAS_TOKEN=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP \
            'test -s /opt/hill90/secrets/openbao-root.token && echo yes || echo no')
          echo "root token on host: $HAS_TOKEN"

          if [ "$HAS_TOKEN" = "yes" ]; then
            KEYS=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP \
              'docker exec -e BAO_ADDR=http://127.0.0.1:8200 \
                 -e BAO_TOKEN="$(cat /opt/hill90/secrets/openbao-root.token)" \
                 openbao bao kv list -format=json secret/ 2>/dev/null | jq -r "length" || echo 0')
            echo "KV entries under secret/: ${KEYS:-0}"
            if [ "${KEYS:-0}" != "0" ]; then
              echo "::error::The vault holds ${KEYS} KV entrie(s) under secret/. Refusing to destroy it."
              echo "::error::Back them up and remove them deliberately, or reinitialize by hand."
              exit 1
            fi
            echo "Vault is configurable and empty. Safe to proceed."
          else
            echo "No root token on the host: the vault cannot be read or configured."
            echo "That is the documented inert state. Proceeding — the backup below is the safety net."
          fi

      # Unconditional, and a hard failure. Whatever the guard above could or
      # could not prove, the bytes are archived before anything is deleted.
      - name: Back up the existing vault volume
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && bash scripts/backup.sh backup vault'

      - name: Verify the backup exists and is non-empty
        run: |
          OUT=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'find /opt/hill90/backups/vault -name "openbao-data.tar.gz" -newermt "-15 minutes" -size +1k | sort | tail -1')
          echo "backup archive: ${OUT:-<none>}"
          if [ -z "$OUT" ]; then
            echo "::error::No fresh non-empty vault backup found. Refusing to wipe the volume."
            exit 1
          fi

      # The preflight is a GUARD, so it runs from THIS checkout, piped over ssh —
      # not from the copy lying on the VPS. See reusable-deploy-service.yml for
      # the fuller note; ported to all five deploy-path sites (app#139). This is
      # one of the three vault-recovery workflows, reached for when something is
      # already wrong — the least convenient place for the old deadlock to bite.
      - name: Checkout preflight (this repo's copy, not the host's)
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && git fetch origin && git diff --stat HEAD origin/main'
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && bash -s' < scripts/preflight-checkout.sh

      - name: Sync host checkout to main
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && git reset --hard origin/main'

      # ---- The destructive part ---------------------------------------------

      - name: Stop the vault stack and remove its volume
        run: |
          IP=${{ steps.get-ip.outputs.tailscale_ip }}
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP \
            'cd /opt/hill90/app && docker compose -p hill90-prod-platform -f deploy/compose/prod/docker-compose.vault.yml down'
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP \
            'docker volume rm openbao-data'
          echo "Volume removed."

      # Storage is chosen here, at the only moment it is free to change. The
      # variables default to the file backend, so leaving switch_to_raft off
      # reproduces the previous behaviour exactly.
      - name: Redeploy the vault
        run: |
          IP=${{ steps.get-ip.outputs.tailscale_ip }}
          if [ "${{ inputs.switch_to_raft }}" = "true" ]; then
            ENVS='export VAULT_CONFIG_FILE=config.raft.hcl VAULT_DATA_PATH=/openbao/raft;'
            echo "Deploying onto raft (integrated storage)."
          else
            ENVS=''
            echo "Deploying onto the file backend — deprecated, removed in OpenBao v2.7.0."
          fi
          # deploy.sh calls auto-unseal, which is a no-op on an uninitialized
          # vault. Verify readiness legitimately fails here: an uninitialized
          # OpenBao answers 501 on /v1/sys/health. That is expected, so the
          # deploy is allowed to fail and the guard is the explicit check below.
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP \
            "cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && ${ENVS} bash scripts/deploy.sh vault prod" || true

      - name: Confirm the vault is up and uninitialized
        run: |
          IP=${{ steps.get-ip.outputs.tailscale_ip }}
          for i in $(seq 1 30); do
            STATE=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP \
              'docker exec -e BAO_ADDR=http://127.0.0.1:8200 openbao bao status -format=json 2>/dev/null | jq -r ".initialized"' || echo "")
            [ -n "$STATE" ] && break
            sleep 4
          done
          echo "initialized=$STATE"
          if [ "$STATE" != "false" ]; then
            echo "::error::Expected a fresh uninitialized vault, got initialized=$STATE"
            exit 1
          fi
          if [ "${{ inputs.switch_to_raft }}" = "true" ]; then
            STORAGE=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP \
              'docker exec -e BAO_ADDR=http://127.0.0.1:8200 openbao bao status -format=json 2>/dev/null | jq -r ".storage_type"')
            echo "storage_type=$STORAGE"
            if [ "$STORAGE" != "raft" ]; then
              echo "::error::Asked for raft, vault reports storage_type=$STORAGE"
              exit 1
            fi
          fi

      # ---- Rebuild, in the order that works ---------------------------------

      - name: Initialize
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && bash scripts/vault.sh init'

      - name: Verify key file ownership and mode
        run: |
          OUT=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'stat -c "%a %U:%G" /opt/hill90/secrets/openbao-unseal.key')
          echo "unseal key: $OUT"
          if [ "$OUT" != "600 deploy:deploy" ]; then
            echo "::error::Unseal key must be 600 deploy:deploy — the auto-unseal systemd unit runs as deploy. Got: $OUT"
            exit 1
          fi

      - name: Unseal
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && bash scripts/vault.sh unseal'

      - name: Store the unseal key in SOPS on the host
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && bash scripts/vault.sh store-unseal-key'

      # Order is the entire point. setup and seed need root, so they run while
      # root still exists — which is what did not happen last time.
      - name: Configure — policies, AppRoles, KV engine
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && export BAO_TOKEN="$(cat /opt/hill90/secrets/openbao-root.token)" && bash scripts/vault.sh setup'

      - name: Seed — populate the KV paths from SOPS
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && export BAO_TOKEN="$(cat /opt/hill90/secrets/openbao-root.token)" && bash scripts/vault.sh seed'

      - name: Mint the read-only sync token
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && export BAO_TOKEN="$(cat /opt/hill90/secrets/openbao-root.token)" && bash scripts/vault.sh setup-sync-token'

      # Enable OIDC BEFORE anything can revoke root. This workflow does not itself
      # revoke — but it used to leave the vault with no OIDC method, and the very
      # next documented step (bootstrap-approles) revokes when it finishes. That
      # combination rebuilt an unconfigurable vault on 2026-08-02, which is the
      # 2026-07-26 failure reached by following the recovery. See
      # docs/runbooks/openbao-rebuild.md and scripts/checks/check_vault_revoke_order.py.
      - name: Enable OIDC auth against the platform realm
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && export SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt && export BAO_TOKEN="$(cat /opt/hill90/secrets/openbao-root.token)" && bash scripts/vault.sh setup-oidc'

      # ---- Prove it, then hand back the secrets ------------------------------

      # h#733: this used to be `sleep 8` after the restart and `sleep 5`
      # after the unseal-service restart — fixed waits hoping the container
      # and the unseal happened in time, the same shape h#725 fixed for
      # grafana-role-login-test.sh's readiness. Reused that shape here:
      # poll a real signal with a bounded deadline instead of guessing a
      # duration.
      #
      # THE READINESS SIGNAL, verified against a real
      # ghcr.io/openbao/openbao:2.6.1 container (the pinned production
      # version), not assumed: `bao status`'s exit code is NOT a uniform
      # "any API error" code the way `bao read`'s is (see h#731) — sealed
      # gives exit 2 with a REAL, parseable JSON body (`sealed: true`),
      # unsealed gives exit 0 with `sealed: false`, and a connection refusal
      # (the server not listening yet) gives exit 1 with a plain-text error,
      # not JSON. So `.sealed` decoding to literally "true" or "false" is a
      # reliable readiness signal — "the server is up and answering" —
      # independent of which sealed state it reports, whereas empty/anything
      # else means it isn't up yet.
      - name: Prove auto-unseal survives a container restart
        run: |
          IP=${{ steps.get-ip.outputs.tailscale_ip }}
          SSH="ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no deploy@$IP"
          READY_DEADLINE_SECONDS="${VAULT_READY_DEADLINE_SECONDS:-90}"
          READY_INTERVAL_SECONDS="${VAULT_READY_INTERVAL_SECONDS:-2}"

          bao_status_field() {
            $SSH 'docker exec -e BAO_ADDR=http://127.0.0.1:8200 openbao bao status -format=json 2>/dev/null' \
              | jq -r ".$1" 2>/dev/null
          }

          wait_for_openbao_to_answer() {
            local deadline=$(( $(date +%s) + READY_DEADLINE_SECONDS ))
            local attempts=0
            while [ "$(date +%s)" -lt "$deadline" ]; do
              attempts=$((attempts + 1))
              local sealed
              sealed="$(bao_status_field sealed)"
              if [ "$sealed" = "true" ] || [ "$sealed" = "false" ]; then
                echo "openbao answering after ${attempts} attempt(s), sealed=${sealed}"
                return 0
              fi
              sleep "$READY_INTERVAL_SECONDS"
            done
            echo "::error::openbao never answered \`bao status\` within ${READY_DEADLINE_SECONDS}s after the restart. Not a seal-state question — the process itself never came back."
            return 1
          }

          $SSH 'docker restart openbao >/dev/null'
          wait_for_openbao_to_answer

          $SSH 'sudo systemctl restart hill90-vault-unseal.service' || \
            $SSH 'cd /opt/hill90/app && bash scripts/vault.sh auto-unseal'

          wait_for_openbao_to_answer

          # The unseal trigger above is fire-and-forget from here (a
          # systemd unit, or a script run over its own ssh session) — polled
          # again, separately, because "the server answers" and "the server
          # reports unsealed" are two different moments.
          UNSEAL_DEADLINE=$(( $(date +%s) + READY_DEADLINE_SECONDS ))
          SEALED=""
          UNSEAL_ATTEMPTS=0
          while [ "$(date +%s)" -lt "$UNSEAL_DEADLINE" ]; do
            UNSEAL_ATTEMPTS=$((UNSEAL_ATTEMPTS + 1))
            SEALED="$(bao_status_field sealed)"
            if [ "$SEALED" = "false" ]; then
              break
            fi
            sleep "$READY_INTERVAL_SECONDS"
          done
          echo "sealed after restart: ${SEALED:-(no answer)} (${UNSEAL_ATTEMPTS} attempt(s) of a ${READY_DEADLINE_SECONDS}s cap)"
          if [ "$SEALED" != "false" ]; then
            echo "::error::Vault did not auto-unseal after restart within ${READY_DEADLINE_SECONDS}s (sealed=${SEALED:-unknown})"
            exit 1
          fi

      - name: Copy updated SOPS back
        id: copy-back
        run: |
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }}:/opt/hill90/app/infra/secrets/prod.enc.env \
            infra/secrets/prod.enc.env
          for k in OPENBAO_UNSEAL_KEY VAULT_SYNC_TOKEN; do
            LEN=$(sops -d --extract "[\"$k\"]" infra/secrets/prod.enc.env | wc -c)
            echo "$k decrypts to $LEN bytes"
            [ "$LEN" -gt 0 ] || { echo "::error::$k missing after copy-back"; exit 1; }
          done

      # Gated on copy-back having actually SUCCEEDED, not merely "not
      # failure" — see vault-init.yml's identical comment for why `!=
      # 'failure'` admits an upstream step dying and leaving copy-back
      # skipped, which is exactly the window that matters here too. skipped
      # is never legitimate for this workflow's copy-back, unlike
      # vault-sync-to-sops.yml below. See
      # scripts/checks/check_vault_cleanup_guard.py.
      - name: Restore host checkout
        if: always() && steps.copy-back.outcome == 'success'
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            'cd /opt/hill90/app && git checkout -- infra/secrets/prod.enc.env && rm -f infra/secrets/prod.enc.env.backup.*' || true

      # Push the branch; do NOT open the PR.
      #
      # This used to use create-pull-request with GITHUB_TOKEN, which produced a
      # PR that could never merge: GitHub does not fire workflows for events
      # triggered by GITHUB_TOKEN, so the required "Run Tests" check never
      # appeared and branch protection blocked it indefinitely. That failed in
      # the worst possible place — silently, at the end of a disaster-recovery
      # run, looking like success.
      #
      # Three ways out were considered:
      #
      #   1. A PAT or GitHub App token, so the PR fires checks normally.
      #      Rejected. It means storing a credential with contents+PR write on
      #      this repo — strictly MORE privileged than the unseal key it exists
      #      to deliver — in Actions, in a repo whose whole discipline is that
      #      secrets live in SOPS. A PAT also expires, which would reintroduce
      #      the same failure shape: a DR procedure that breaks silently, months
      #      later, discovered mid-incident.
      #
      #   2. Skip the PR and push straight to main. Not available: main requires
      #      the "Run Tests" check, so GITHUB_TOKEN cannot push to it, and
      #      weakening protection to suit one workflow is the wrong trade.
      #
      #   3. Push the branch and leave PR creation to the operator. Chosen.
      #
      # (3) wins on the facts of this repo: main requires NO approvals, only the
      # "Run Tests" check. So opening the PR is one command and it then merges
      # itself. The operator is already present — they just dispatched this. And
      # the workflow now succeeds only when it has actually finished, instead of
      # leaving a PR nobody can merge.
      - name: Push the new secrets to a branch
        id: push-secrets
        run: |
          BRANCH="chore/vault-reinit-secrets-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add infra/secrets/prod.enc.env
          if git diff --cached --quiet; then
            echo "::error::prod.enc.env is unchanged — the new unseal key was not written back."
            exit 1
          fi
          git commit -m "chore(vault): new unseal key and sync token after reinitialize

          Generated by .github/workflows/vault-reinitialize.yml run ${GITHUB_RUN_ID}.
          A fresh init mints a new unseal key, so the previous OPENBAO_UNSEAL_KEY
          is dead and nothing in CI works against this vault until this lands."
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # Says plainly that the job is not finished until this merges, so a green
      # tick cannot be mistaken for "the key is on main".
      - name: Confirm main does not yet have the new key
        run: |
          git fetch origin main --quiet
          if git diff --quiet "origin/main" -- infra/secrets/prod.enc.env; then
            echo "main already matches — nothing left to merge."
          else
            echo "::warning::main does NOT yet carry the new unseal key. Open and merge the branch below before relying on CI-driven unseal."
          fi

      - name: What is left to do
        run: |
          BRANCH="${{ steps.push-secrets.outputs.branch }}"
          {
            echo "## Vault reinitialized"
            echo ""
            echo "Storage backend: **${{ inputs.switch_to_raft && 'raft (integrated storage)' || 'file (deprecated)' }}**"
            echo ""
            echo "Done in this run: backup, wipe, redeploy, init, unseal, store key, setup, seed, sync token, auto-unseal proof."
            echo ""
            echo "### 1. Land the new secrets — do this first"
            echo ""
            echo "The new unseal key is on \`${BRANCH}\`, not on \`main\`. Until it merges,"
            echo "\`main\` carries a key for a vault that no longer exists."
            echo ""
            echo "This workflow deliberately does not open the PR: a PR opened with"
            echo "GITHUB_TOKEN never fires the required check and can never merge."
            echo "\`main\` requires no approvals, so opening it is one command and it"
            echo "then merges on its own."
            echo ""
            echo '   ```'
            echo "   gh pr create --base main --head ${BRANCH} \\"
            echo "     --title 'chore(vault): new unseal key and sync token after reinitialize' \\"
            echo "     --body 'Generated by vault-reinitialize.yml run ${GITHUB_RUN_ID}.'"
            echo "   gh pr merge --squash --auto --delete-branch"
            echo '   ```'
            echo ""
            echo "   Or open it in the browser:"
            echo "   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo ""
            echo "### 2. Revoke root, once you are satisfied the vault behaves"
            echo ""
            echo '   ```'
            echo '   ssh deploy@remote.hill90.com "cd /opt/hill90/app && bash scripts/vault.sh revoke-root"'
            echo '   ```'
            echo ""
            echo "   One-way door. On OpenBao >= 2.5.3 the root-regeneration endpoints are disabled,"
            echo "   so after this the vault cannot be reconfigured without repeating this workflow."
            echo "   Deliberately not automated."
            echo ""
            echo "### Optional"
            echo ""
            echo "Re-enable the weekly sync schedule in \`.github/workflows/vault-sync-to-sops.yml\`,"
            echo "but only after a manual \`workflow_dispatch\` run of it has gone green."
          } >> "$GITHUB_STEP_SUMMARY"
