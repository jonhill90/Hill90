name: Deploy Drift Alarm

# Is what the host has CHECKED OUT the same as what was MERGED?
#
# hill90-app hit this on 2026-08-03: a merged security fix was not running for
# 23 minutes because two defects in that repo's deploy path each failed the
# deploy, and nothing reported it. Nothing COULD: every health check answers
# from the running container, so it correctly reports the OLD code as
# healthy. This repo has the identical deploy shape in five places (app#140,
# ported here as #705) and, before this workflow, nothing here compared
# deployed against merged either.
#
# WHY THE COMPARISON HAPPENS ON THE RUNNER. The host is asked one question —
# `git rev-parse HEAD` — and every judgement is made here, against this
# checkout. Running the check from the host's copy would rebuild the
# bootstrap deadlock (app#139's shape) inside the alarm itself: a stale
# checkout deciding whether it is stale.
#
# WHY IT IS NOT `deployed != main`. This repo's deploys are workflow_dispatch,
# or gated by deploy.yml's push path filters — not "every merge ships" — so
# drift is the NORMAL state between deploys. The rules that decide what is
# actionable live in scripts/checks/check_deploy_drift.sh and are
# positive-controlled in tests/scripts/deploy-drift-control.bats.
#
# SCOPE: this checks the CHECKOUT only, deliberately not which commit any
# running container was built from — see the comment at the top of
# check_deploy_drift.sh for why, and hill90-app's #158 for the gap this leaves.

on:
  schedule:
    # Every four hours. The grace window is four hours by default, so a fix
    # that is merged and forgotten is named within roughly eight — fast enough
    # to matter, slow enough that a normal working day of merges stays quiet.
    - cron: '37 */4 * * *'
  workflow_dispatch:
    inputs:
      grace_hours:
        description: 'Hours a deployable commit may wait before this alarms'
        required: false
        default: '4'
        type: string
      deployed_sha_override:
        description: >-
          POSITIVE CONTROL. Pretend the host is on this SHA instead of asking it.
          Use a deliberately stale commit to watch the alarm fire, so it has been
          seen red before it is trusted green.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-drift
  cancel-in-progress: false

jobs:
  drift:
    name: deployed vs main
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_APP_PATH: /opt/hill90/app

    steps:
      # Full history: the check walks deployed..origin/main and reads commit
      # dates. A shallow clone would make every comparison unresolvable, which
      # this check reports as exit 2 rather than passing — but a permanently
      # unknown alarm is a broken one.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight — required secrets are present
        if: inputs.deployed_sha_override == ''
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          missing=()
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET VPS_SSH_PRIVATE_KEY SOPS_AGE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Deploy drift alarm cannot run: missing secret(s) ${missing[*]}. This is not a pass — nothing was compared."
            exit 1
          fi

      - name: Setup Tailscale
        if: inputs.deployed_sha_override == ''
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH key
        if: inputs.deployed_sha_override == ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Setup SOPS/age
        if: inputs.deployed_sha_override == ''
        env:
          SOPS_VERSION: '3.9.4'
        run: |
          SOPS_URL="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/sops "$SOPS_URL"
          if file /tmp/sops | grep -q "HTML"; then
            echo "::error::SOPS download returned HTML instead of binary — check URL: $SOPS_URL"
            exit 1
          fi
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Get Tailscale IP from secrets
        id: get-ip
        if: inputs.deployed_sha_override == ''
        run: |
          TAILSCALE_IP=$(sops -d --extract '["TAILSCALE_IP"]' infra/secrets/prod.enc.env)
          if [ -z "$TAILSCALE_IP" ]; then
            echo "::error::TAILSCALE_IP is empty or absent in infra/secrets/prod.enc.env"
            exit 1
          fi
          echo "::add-mask::$TAILSCALE_IP"
          echo "tailscale_ip=$TAILSCALE_IP" >> $GITHUB_OUTPUT

      # One question, read-only. No fetch, no reset — this must not change what
      # it is measuring, and it must never be able to "fix" the drift it reports.
      - name: Ask the host which commit it is running
        id: host
        if: inputs.deployed_sha_override == ''
        run: |
          sha=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "cd ${VPS_APP_PATH} && git rev-parse HEAD" 2>/dev/null | tr -d '[:space:]')
          # Deliberately NOT failing here on an empty answer. An unreachable or
          # unreadable host is exactly the state the check reports as exit 2,
          # and routing it through the check keeps one place that decides what
          # "cannot tell" means.
          echo "sha=${sha}" >> $GITHUB_OUTPUT
          if [ -z "$sha" ]; then
            echo "::warning::Could not read a SHA from the host; the check will report this as UNKNOWN."
          fi

      - name: Compare deployed against main
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha_override != '' && inputs.deployed_sha_override || steps.host.outputs.sha }}
          GRACE_HOURS: ${{ inputs.grace_hours || '4' }}
          TARGET_REF: origin/main
          LABEL: Hill90 (${{ env.VPS_APP_PATH }})
        run: |
          if [ -n "${{ inputs.deployed_sha_override }}" ]; then
            echo "::notice::POSITIVE CONTROL — pretending the host is on ${{ inputs.deployed_sha_override }}. The host was not contacted."
          fi
          # `|| rc=$?` is load-bearing. GitHub runs this with `bash -e {0}`, so a
          # bare invocation of a check that exits 1 aborts the step immediately
          # and the case below never runs — the exit code would be right and the
          # explanation absent. Same shape as the swallowed hook this estate has
          # hit before.
          rc=0
          bash scripts/checks/check_deploy_drift.sh || rc=$?
          case "$rc" in
            0) echo "::notice::No actionable deploy drift." ;;
            1) echo "Deploy the affected stacks, or record why not." ;;
            2) echo "The alarm could not determine what is running. Treat as unverified, not as fine." ;;
            *) echo "::error::Unrecognised exit code $rc from check_deploy_drift.sh — a new state was added without a branch here. Treat as unverified." ;;
          esac
          exit $rc

      # h#845 (split from hill90-app#598, which itself came from
      # hill90-app#593). hill90-app#593's containerProfileCeilingViolations()
      # only ever console.error()s a live violation on API startup — nothing
      # reads that. #598 checked whether the api could just expose a
      # Prometheus gauge instead: it does not today, and building a metrics
      # pipeline sideways for one rare condition is a bigger decision than
      # this warranted (see #598's own writeup, including that app-api and
      # this repo's prometheus DO share a docker network, so it was never a
      # capability question, only a scope one). This is the alternative Jon
      # chose: piggyback on THIS scheduled workflow, which already reaches
      # the VPS every four hours and already has a reader — no new
      # workflow, no new watchdog wiring, no new metrics pipeline.
      #
      # WHERE THE CEILINGS COME FROM, NOT A HARDCODED COPY. MAX_AGENT_CPUS/
      # MAX_AGENT_MEM_BYTES/MAX_AGENT_PIDS_LIMIT live in hill90-app's
      # services/api/src/helpers/agent-resource-limits.ts (consolidated
      # there by hill90-app#596's own review — before that they were
      # scattered across two files in that repo, and typing a THIRD copy
      # into THIS repo would be the identical twin-drift shape, one
      # repository over. Sparse-checked-out below and grepped directly, so
      # this always compares against whatever hill90-app's main branch
      # currently says.
      - name: Checkout hill90-app, for its own resource-ceiling constants
        if: always() && inputs.deployed_sha_override == ''
        uses: actions/checkout@v4
        with:
          repository: jonhill90/hill90-app
          path: tenant
          sparse-checkout: |
            services/api/src/helpers/agent-resource-limits.ts
          sparse-checkout-cone-mode: false

      - name: Extract MAX_AGENT_* from hill90-app's own source
        id: ceilings
        if: always() && inputs.deployed_sha_override == ''
        run: |
          f=tenant/services/api/src/helpers/agent-resource-limits.ts
          if [ ! -f "$f" ]; then
            echo "::warning::hill90-app has not merged agent-resource-limits.ts yet (or moved it) — the ceiling check will report this as UNKNOWN."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cpus=$(grep -oE 'MAX_AGENT_CPUS = [0-9.]+' "$f" | grep -oE '[0-9.]+$' || true)
          mem=$(grep -oE 'MAX_AGENT_MEM_BYTES = [0-9]+' "$f" | grep -oE '[0-9]+$' || true)
          pids=$(grep -oE 'MAX_AGENT_PIDS_LIMIT = [0-9]+' "$f" | grep -oE '[0-9]+$' || true)
          if [ -z "$cpus" ] || [ -z "$mem" ] || [ -z "$pids" ]; then
            echo "::warning::Could not extract all three MAX_AGENT_* constants from $f (cpus='$cpus' mem='$mem' pids='$pids') — the ceiling check will report this as UNKNOWN."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "cpus=${cpus}" >> "$GITHUB_OUTPUT"
          echo "mem=${mem}" >> "$GITHUB_OUTPUT"
          echo "pids=${pids}" >> "$GITHUB_OUTPUT"

      # Read-only. `-U hill90`, the platform admin role — NOT `postgres`,
      # which does not exist on this Postgres, and not the tenant's own
      # `hill90_app` role, to keep this on the same credential every other
      # cross-cutting platform check in this repo already uses. The `ERROR`
      # sentinel (rather than an empty string) is deliberate: an empty
      # profiles-json argument and a failed-to-read one must be
      # distinguishable to the Python script, which treats an empty LIST
      # as its own, different finding (see its own docstring) — collapsing
      # "could not ask" and "asked, got nothing" into the same string would
      # blur exactly the distinction this issue is about.
      - name: Read container_profiles from the live database
        id: profiles
        if: always() && inputs.deployed_sha_override == '' && steps.ceilings.outputs.ok == 'true'
        run: |
          json=$(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "docker exec postgres psql -U hill90 -d hill90_api -tAc \"SELECT COALESCE(json_agg(row_to_json(t)), '[]') FROM (SELECT name, default_cpus, default_mem_limit, default_pids_limit FROM container_profiles) t;\"" \
            2>/dev/null)
          if [ -z "$json" ]; then
            echo "::warning::Could not read container_profiles from the host (unreachable, or the query failed) — the ceiling check will report this as CANNOT DETERMINE."
            json="ERROR"
          fi
          # Multi-line-safe GITHUB_OUTPUT write — the JSON is one line from
          # psql -t, but this avoids re-learning that the hard way later.
          echo "json<<CEILINGS_EOF" >> "$GITHUB_OUTPUT"
          echo "$json" >> "$GITHUB_OUTPUT"
          echo "CEILINGS_EOF" >> "$GITHUB_OUTPUT"

      - name: Assert every container_profiles row fits under hill90-app's own ceilings
        if: always() && inputs.deployed_sha_override == ''
        run: |
          if [ "${{ steps.ceilings.outputs.ok }}" != "true" ]; then
            echo "::error::CANNOT DETERMINE: hill90-app's MAX_AGENT_* constants were not readable this run. Not a pass — see the extraction step above."
            exit 2
          fi
          rc=0
          python3 scripts/checks/check_container_profile_ceilings.py \
            --max-cpus "${{ steps.ceilings.outputs.cpus }}" \
            --max-mem-bytes "${{ steps.ceilings.outputs.mem }}" \
            --max-pids-limit "${{ steps.ceilings.outputs.pids }}" \
            --profiles-json '${{ steps.profiles.outputs.json }}' || rc=$?
          case "$rc" in
            0) echo "::notice::Every container_profiles row fits under hill90-app's MAX_AGENT_* ceilings." ;;
            1) echo "Fix the named profile row, or raise the ceiling in hill90-app's agent-resource-limits.ts with a deliberate reason." ;;
            2) echo "Could not determine — treat as unverified, not as fine." ;;
            *) echo "::error::Unrecognised exit code $rc from check_container_profile_ceilings.py." ;;
          esac
          exit $rc

      # h#712 (narrowed): a dead-man's-switch for the SCHEDULE itself. Same
      # reasoning as the equivalent step in audit-hill90-ui-client.yml —
      # `if: always()` so a REAL drift finding (already emailed immediately
      # by #714) doesn't also go stale on this metric and page a second time.
      #
      # EXCLUDED on the positive-control dispatch path
      # (`deployed_sha_override`), and this exclusion is load-bearing, not
      # cosmetic: that path never contacts the host (see "Ask the host which
      # commit it is running" above), so `steps.get-ip.outputs.tailscale_ip`
      # is unset and this step would just fail to connect — but more to the
      # point, a synthetic test dispatch succeeding is not evidence the REAL
      # scheduled path ran, and letting it refresh the heartbeat would let
      # someone keep this metric artificially fresh by running the control
      # repeatedly while the actual cron silently stopped firing — precisely
      # the failure this alert exists to catch.
      - name: Emit scheduled-workflow heartbeat
        if: always() && inputs.deployed_sha_override == ''
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "cd ${VPS_APP_PATH} && bash -s" <<'REMOTE'
          set -euo pipefail
          DIR=/opt/hill90/metrics/textfile_collector
          FILE="${DIR}/hill90_scheduled_workflow_deploy-drift.prom"
          TMP="${DIR}/.hill90_scheduled_workflow_deploy-drift.prom.tmp"
          mkdir -p "$DIR"
          TS=$(date +%s)
          {
            echo "# HELP hill90_scheduled_workflow_last_run_timestamp_seconds Unix time this scheduled workflow last reached a verdict (success or failure), regardless of what it decided"
            echo "# TYPE hill90_scheduled_workflow_last_run_timestamp_seconds gauge"
            echo "hill90_scheduled_workflow_last_run_timestamp_seconds{workflow=\"deploy-drift\"} ${TS}"
          } > "$TMP"
          mv -f "$TMP" "$FILE"
          chmod 644 "$FILE"
          REMOTE
