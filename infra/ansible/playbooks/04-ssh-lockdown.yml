---
# SSH Lockdown to Tailscale Network
#
# ---------------------------------------------------------------------------
# WHY THIS WRITES A DROP-IN AND NOT sshd_config
# ---------------------------------------------------------------------------
#
# This role used to set hardening with `lineinfile` against /etc/ssh/sshd_config.
# It ran, reported changed, and had no effect on the setting that mattered.
#
# sshd takes the FIRST value it encounters for a keyword. On AlmaLinux/RHEL 9+
# the stock sshd_config carries `Include /etc/ssh/sshd_config.d/*.conf` near the
# top — line 15 on this host — while the value this role wrote landed at line
# 64. Cloud images ship /etc/ssh/sshd_config.d/50-cloud-init.conf containing
# `PasswordAuthentication yes`, which the include pulls in first, so the
# hardened value further down was never reached.
#
# Observed on the running host: `sshd -T` reported `passwordauthentication yes`
# while sshd_config:64 said no. `PermitRootLogin no` and `MaxAuthTries 3` did
# take effect, because no drop-in overrides those — which is exactly why this
# went unnoticed. Two thirds of the role worked.
#
# cloud-init regenerates its drop-in, so this is a recurring regression rather
# than one-off drift: it would come back after any rebuild.
#
# The fix is to write a drop-in that sorts BEFORE cloud-init's. Drop-ins are
# read in lexical glob order and first-match-wins, so 00-hill90-hardening.conf
# is authoritative over 50-cloud-init.conf. cloud-init is additionally told not
# to manage the setting, so the two do not fight on rebuild.
#
# Every change is then verified against `sshd -T`. An assertion nobody checks is
# how the previous version survived a full rebuild.

# ---------------------------------------------------------------------------
# GATE: refuse to lock the door until we have proven there is a key that
# opens it
# ---------------------------------------------------------------------------
#
# 01-system-prep.yml copies /root/.ssh/authorized_keys to the deploy user
# and is deliberately tolerant of that copy failing, because not every
# provider puts the key there; some deliver it elsewhere or via cloud-init
# user-data instead. That tolerance is correct for THAT task, but it means
# nothing downstream of it can assume the copy worked.
#
# This is defence in depth, not the only door: 03-tailscale.yml runs before
# this play (bootstrap.yml order is 01, 02, 03-tailscale, 04) and brings up
# `tailscale up --ssh`, so Tailscale SSH is already answering connections
# over the tailnet BEFORE this play touches anything — verified on the real
# host: `ssh -v` over the tailnet reports "remote software version
# Tailscale" and "Authenticated using none", and it authorises by tailnet
# ACL, never by reading authorized_keys. A missing key here does NOT brick
# the host through that path.
#
# What it does break, and why the gate still earns its place:
#   - Tailscale SSH is later disabled, or RunSSH is turned off — both
#     one-line changes in future config, neither reviewed against this play.
#   - A connection over the host's public interface, where OpenSSH's own
#     PermitRootLogin no (set below) is what applies, not Tailscale SSH.
#   - An operator without tailnet access, who has only the OpenSSH path.
# In every one of those, disabling PasswordAuthentication and
# PermitRootLogin with no verified key for deploy_user turns "degraded" into
# "no way in" for whoever hits it.
#
# So the check belongs HERE, not on the copy in 01. Gating here catches
# every way the key could be missing or empty — a failed copy, a provider
# that never put it there, cloud-init not having run yet, a future edit
# that changes how it's provisioned — not just this one copy failing. It is
# also the last point at which failing loudly is still safe: nothing below
# this task has touched sshd yet.
- name: Stat the deploy user's authorized_keys before disabling password/root login
  stat:
    path: "{{ deploy_home }}/.ssh/authorized_keys"
  register: deploy_authorized_keys

- name: Refuse to proceed without a usable key for the deploy user
  assert:
    that:
      - deploy_authorized_keys.stat.exists
      - deploy_authorized_keys.stat.isreg
      - deploy_authorized_keys.stat.size > 0
    fail_msg: |
      {{ deploy_home }}/.ssh/authorized_keys is missing, not a regular file,
      or empty.

      This play is about to disable PasswordAuthentication and
      PermitRootLogin. Tailscale SSH (brought up in 03-tailscale.yml, before
      this play) does not depend on this file and stays up regardless — but
      OpenSSH access for "{{ deploy_user }}" becomes UNREACHABLE the moment
      sshd reloads, with no route back short of console/rescue access from
      the provider. That is the only path left for anyone connecting over
      the public interface, without tailnet access, or if Tailscale SSH is
      ever disabled or RunSSH turned off.

      Refusing to continue. Fix how the key reaches {{ deploy_user }}
      (see 01-system-prep.yml's authorized_keys copy) and re-run.
    success_msg: "Verified: {{ deploy_user }} has a non-empty authorized_keys — safe to lock down SSH"

# ---------------------------------------------------------------------------
# GATE 2: a file existing is not proof sshd will accept it (h#787)
# ---------------------------------------------------------------------------
#
# The stat/assert above only proves authorized_keys is a non-empty regular
# file at the right path. It does NOT prove sshd will honour it: wrong
# ownership or permissions on the file or its parent .ssh directory (sshd's
# StrictModes refuses group/world-writable paths), an SELinux context
# mismatch, or a PubkeyAuthentication/AuthorizedKeysFile setting that points
# somewhere else, can each leave a correctly-copied, non-empty key file
# completely unusable — exactly the case a file-existence check waves
# through.
#
# There is no way to test with the REAL key: only its public half was ever
# copied to this host (01-system-prep.yml), and the matching private key
# lives with the human operator, never on the VPS. So this generates a
# throwaway keypair ON THE HOST, appends its public half to the SAME file at
# the SAME path with the SAME ownership/permissions/context the real key
# already has, and attempts an actual authenticated connection with the
# private half — over loopback, which is answered by real OpenSSH, not
# Tailscale SSH (Tailscale SSH only intercepts traffic arriving on the
# tailscale0 interface; see the header comment above for the `ssh -v`
# evidence that a tailnet connection never reaches it). That proves the
# ACCESS MECHANISM — permissions, ownership, SELinux, sshd config — works for
# this exact file, without ever needing the real private key. It does not
# re-prove the real key's own content is well-formed; the non-empty check
# above already covers that a different way.
#
# block/rescue/always, not two independent tasks: the throwaway key MUST be
# removed from authorized_keys and disk whether the probe connection
# succeeds, fails, or the play is interrupted mid-block — leaving it behind
# would be a second, self-inflicted unauthorized key on a host this play is
# about to lock down.
- name: Prove an authenticated SSH connection as the deploy user actually works
  block:
    - name: Generate a throwaway keypair to probe sshd's acceptance path
      command: >
        ssh-keygen -t ed25519 -N '' -q
        -f /tmp/.hill90-ssh-gate-{{ ansible_date_time.epoch }}
        -C hill90-ssh-lockdown-gate-probe
      register: gate_keygen
      changed_when: false

    - name: Read the probe's public key
      slurp:
        src: "/tmp/.hill90-ssh-gate-{{ ansible_date_time.epoch }}.pub"
      register: gate_pubkey_raw

    - name: Append the probe's public key to the deploy user's authorized_keys
      lineinfile:
        path: "{{ deploy_home }}/.ssh/authorized_keys"
        line: "{{ (gate_pubkey_raw.content | b64decode).strip() }}"
        create: no

    - name: Attempt an actual authenticated SSH connection as the deploy user, over loopback
      command: >
        ssh -i /tmp/.hill90-ssh-gate-{{ ansible_date_time.epoch }}
        -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ConnectTimeout=5 -o PreferredAuthentications=publickey
        {{ deploy_user }}@127.0.0.1 true
      register: gate_connection
      changed_when: false
      failed_when: false

  always:
    - name: Remove the probe's line from authorized_keys
      lineinfile:
        path: "{{ deploy_home }}/.ssh/authorized_keys"
        line: "{{ (gate_pubkey_raw.content | b64decode).strip() }}"
        state: absent
      when: gate_pubkey_raw is defined and gate_pubkey_raw.content is defined

    - name: Remove the probe keypair files
      file:
        path: "/tmp/.hill90-ssh-gate-{{ ansible_date_time.epoch }}{{ item }}"
        state: absent
      loop:
        - ""
        - ".pub"

- name: Refuse to proceed unless the probe connection actually authenticated
  assert:
    that:
      - gate_connection.rc == 0
    fail_msg: |
      A throwaway key was appended to {{ deploy_home }}/.ssh/authorized_keys
      in exactly the same way the real key already there was, and sshd
      refused to authenticate with it over loopback (exit
      {{ gate_connection.rc | default('?') }}).

      The file existing and being non-empty (verified above) is NOT the same
      as sshd actually accepting a key from it. Likely causes: wrong
      ownership or permissions on {{ deploy_home }}/.ssh or its
      authorized_keys (sshd's StrictModes refuses group/world-writable
      paths), an SELinux context mismatch, or PubkeyAuthentication /
      AuthorizedKeysFile misconfigured in sshd_config.

      This play is about to disable PasswordAuthentication and
      PermitRootLogin. Refusing to continue with an access path that has not
      been proven to work — a file being present was never sufficient proof.

      stderr from the probe connection:
      {{ gate_connection.stderr | default('(no output)') }}
    success_msg: "Verified: an authenticated SSH connection as {{ deploy_user }} actually succeeds — safe to lock down SSH"

- name: Lock SSH to Tailscale network only (100.64.0.0/10)
  firewalld:
    rich_rule: 'rule family="ipv4" source address="100.64.0.0/10" service name="ssh" accept'
    permanent: yes
    state: enabled
    immediate: yes

- name: Remove public SSH access
  firewalld:
    service: ssh
    permanent: yes
    state: disabled
    immediate: yes

# ---------------------------------------------------------------------------
# SSH hardening, written where it wins
# ---------------------------------------------------------------------------

- name: Deploy SSH hardening drop-in (sorts before cloud-init's)
  copy:
    dest: /etc/ssh/sshd_config.d/00-hill90-hardening.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      # Managed by infra/ansible/playbooks/04-ssh-lockdown.yml — do not edit by hand.
      #
      # Named 00- so it is read before 50-cloud-init.conf. sshd takes the FIRST
      # value it sees for a keyword, so settings here win over both the
      # cloud-init drop-in and /etc/ssh/sshd_config.
      #
      # Verify with: sudo sshd -T | grep -E '^(passwordauthentication|permitrootlogin)'

      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
  register: sshd_dropin

# `sshd -t` validates the FULL effective configuration, includes and all, which
# is the only way to know the drop-in composes correctly with what is already
# there. It runs BEFORE any restart, and a bad file is removed rather than left
# in place — otherwise the next restart by anything at all would fail, and the
# only route in is the tailnet.
- name: Validate the effective sshd configuration
  command: /usr/sbin/sshd -t
  register: sshd_validate
  changed_when: false
  failed_when: false

- name: Remove the drop-in if it produced an invalid configuration
  file:
    path: /etc/ssh/sshd_config.d/00-hill90-hardening.conf
    state: absent
  when: sshd_validate.rc != 0

- name: Fail loudly if the hardening drop-in is invalid
  fail:
    msg: |
      The SSH hardening drop-in produced an invalid sshd configuration and has
      been removed. sshd was NOT restarted, so access is unaffected.

      sshd -t said:
      {{ sshd_validate.stderr | default('(no output)') }}
  when: sshd_validate.rc != 0

- name: Restart sshd to apply the drop-in
  systemd:
    name: sshd
    state: restarted
  when: sshd_dropin.changed

# Stop cloud-init reasserting PasswordAuthentication on rebuild. The 00- drop-in
# already wins, but leaving cloud-init writing the opposite value means the host
# carries two files that disagree, and the next reader has to know the ordering
# rule to work out which applies.
- name: Stop cloud-init from managing SSH password authentication
  copy:
    dest: /etc/cloud/cloud.cfg.d/99-hill90-ssh.cfg
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by infra/ansible/playbooks/04-ssh-lockdown.yml
      # Password authentication is set in /etc/ssh/sshd_config.d/00-hill90-hardening.conf
      ssh_pwauth: false
  failed_when: false   # cloud-init is not on every image; its absence is not fatal

# ---------------------------------------------------------------------------
# Verification — the part whose absence let this persist
# ---------------------------------------------------------------------------
#
# `sshd -T` is the effective, post-include configuration. Comparing intent
# against it is the only check that would have caught the original defect: the
# file said the right thing and the running daemon did not.

- name: Read the effective sshd configuration
  command: /usr/sbin/sshd -T
  register: sshd_effective
  changed_when: false

- name: Assert SSH hardening actually applied
  assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout_lines"
      - "'permitrootlogin no' in sshd_effective.stdout_lines"
      - "'pubkeyauthentication yes' in sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
      - "'permitemptypasswords no' in sshd_effective.stdout_lines"
      - "'maxauthtries 3' in sshd_effective.stdout_lines"
    fail_msg: |
      SSH hardening did NOT take effect. The effective configuration disagrees
      with what this role wrote, which means something is overriding it.

      Effective values:
      {{ sshd_effective.stdout_lines
         | select('match', '^(passwordauthentication|permitrootlogin|pubkeyauthentication|kbdinteractiveauthentication|permitemptypasswords|maxauthtries)')
         | list | join('\n') }}

      Find the file that wins with:
        sudo grep -rniE '^\s*(PasswordAuthentication|PermitRootLogin)' /etc/ssh/
    success_msg: "SSH hardening verified against sshd -T (password auth off, root login off, key auth on)"

# ---------------------------------------------------------------------------
# NOTE ON fail2ban
# ---------------------------------------------------------------------------
#
# This role used to install, configure and start fail2ban with `ignore_errors:
# yes` on all three tasks. fail2ban is in none of the repositories enabled on
# this host — AlmaLinux 10 BaseOS, AppStream, CRB, Extras, Docker CE and
# Tailscale — so the install failed, the failure was ignored, the configure and
# start tasks failed and were ignored too, and the play reported success. The
# binary is absent on the running host while the docs claimed the service was
# enabled.
#
# That is the same defect as the sshd_config problem above: a step that cannot
# work, reporting that it did. The tasks are removed rather than left pretending,
# and docs/architecture/security.md no longer claims it.
#
# Restoring it would mean enabling EPEL — a deliberate decision about adding a
# third-party repository to a hardened host, not one to make silently. Its value
# is also limited in this topology: SSH is not reachable from the public
# internet (firewalld carries no ssh service; verified externally) and, after
# this change, accepts keys only, so there is no exposed surface for the
# brute-force protection fail2ban provides. If it is wanted as defence in depth,
# add EPEL and fail2ban deliberately, with verification, and update the docs to
# match. Do not restore tasks that report success when they have done nothing.
