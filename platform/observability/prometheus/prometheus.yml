global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # MinIO exposes cluster metrics without auth because the compose file sets
  # MINIO_PROMETHEUS_AUTH_TYPE=public. The endpoint is on the internal network
  # only; nothing external can reach it.
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # The tenant application (github.com/jonhill90/hill90-app) keeps its own
  # Postgres — Hill90's platform database is deliberately not shared, and its
  # health check asserts platform-only databases. So the app's database needs
  # its own exporter, and Hill90 scrapes it because Hill90 owns observability.
  #
  # `app-postgres-exporter` is the RENAMED container. The app currently ships
  # `container_name: postgres-exporter`, which collides with the platform
  # exporter below and cannot start alongside it. This target therefore stays
  # DOWN until the app renames it AND is deployed — see
  # docs/runbooks/tenant-app-deployment.md §3 phase A.
  #
  # A down target matches the ServiceDown rule in alerts.yml (up == 0, for 5m,
  # severity critical). There is no Alertmanager, so nothing is paged, but it
  # will show as a firing critical in Prometheus and Grafana until the app
  # deploys. That is a deliberate trade: a visible reminder of unmonitored
  # tenant state, rather than silently forgetting to add the job later.
  - job_name: app-postgres-exporter
    static_configs:
      - targets: ["app-postgres-exporter:9187"]
