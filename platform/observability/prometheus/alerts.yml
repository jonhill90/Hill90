# Every rule here MUST carry summary, description and action annotations.
# `action` is not decoration: it is rendered into the notification body as
# "Do this first". An alert that says FIRING and nothing else trains the one
# person who receives it to ignore the sender — see
# docs/decisions/alerting-audit.md.

groups:
  # ---------------------------------------------------------------------------
  # The two gaps ranked highest in the alerting audit. Both are failures that
  # would otherwise go unnoticed for days, and neither had ANY signal before.
  # ---------------------------------------------------------------------------
  - name: availability
    rules:
      - alert: PublicSiteDown
        # probe_success is 0 when the HTTP probe did not get a 200. 2m rather
        # than 5m: this is the product being unreachable from the internet, and
        # a deploy that replaces app-ui takes seconds, not minutes.
        expr: probe_success{job="blackbox-public"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "hill90.com is not answering from the internet"
          description: >-
            The blackbox probe of {{ $labels.instance }} has not received HTTP 200
            for over 2 minutes. This is the tenant's UI — the public product — so
            users are seeing this too.
          action: >-
            Check the edge before the app: `docker ps --filter name=traefik` and
            `docker logs --tail 50 traefik`. If Traefik is healthy, the tenant's
            app-ui is the next suspect — it is NOT a Prometheus scrape target, so
            this probe is the only signal. Confirm from outside with
            `curl -sI https://hill90.com`.
          runbook: docs/runbooks/troubleshooting.md

      - alert: VaultSealedOrUnreachable
        # /v1/sys/health returns 503 when sealed and 501 when uninitialised, so a
        # 200-or-nothing probe covers sealed, down and uninitialised alike without
        # depending on which code came back.
        expr: probe_success{job="blackbox-vault"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OpenBao is sealed, uninitialised or unreachable"
          description: >-
            The unauthenticated health probe of {{ $labels.instance }} has not returned
            HTTP 200 for over 5 minutes. 503 means SEALED, 501 means uninitialised.
            A sealed vault breaks nothing user-facing, which is exactly why this
            would otherwise go unnoticed until the next deploy — or until a recovery.
          action: >-
            Run `docker exec openbao bao status`. If it reports `Sealed true`, unseal
            with `bash scripts/vault.sh unseal`. If this followed a reboot, the
            systemd unit hill90-vault-unseal did not do its job — check
            `systemctl status hill90-vault-unseal` before unsealing by hand, or the
            same thing happens after the next reboot.
          runbook: docs/runbooks/vault-unseal.md

      # See the job comment in prometheus.yml for why this is edge scope rather
      # than tenant-internal monitoring, and docs/decisions/tenant-monitoring-coverage.md
      # for the boundary argument and what deliberately was NOT added.
      - alert: TenantApiDown
        expr: probe_success{job="blackbox-tenant-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "api.hill90.com is not answering from the internet"
          description: >-
            The blackbox probe of {{ $labels.instance }} has not received HTTP 200 for
            over 2 minutes. hill90.com can still return 200 while this is broken — the
            UI's own /api/health reports service "ui" and does not proxy to the API — so
            PublicSiteDown will NOT cover this. Signed-in features that call the API are
            failing for users.
          action: >-
            Check the edge first: `docker ps --filter name=traefik`. Then the tenant's
            container, which is NOT a Prometheus scrape target — `docker ps -a --filter
            name=app-api` and `docker logs --tail 50 app-api`. Confirm from outside with
            `curl -s https://api.hill90.com/health`. This is the TENANT's container: the
            platform can see it is down but cannot fix it, so the tenant's deploy path is
            where the repair happens.
          runbook: docs/decisions/tenant-monitoring-coverage.md

  - name: service-health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: >-
            Scrape target {{ $labels.instance }} (job {{ $labels.job }}) has been
            down for more than 5 minutes on the platform host.
          action: >-
            `docker ps -a --filter name={{ $labels.job }}` then
            `docker logs --tail 50 {{ $labels.job }}`. If the container is healthy
            but the target is down, the metrics endpoint or the internal network is
            the fault, not the service.
          runbook: docs/runbooks/observability.md

      # Complements ServiceDown rather than duplicating it. ServiceDown catches a
      # container that goes down AND STAYS down for 5m. A container that dies and
      # is restarted every 30s is never down long enough to trip it, so a crash
      # loop is invisible to `up == 0`.
      #
      # THE SIGNAL IS NOT cADVISOR. The obvious source would be
      # container_start_time_seconds, and it is a dead end on this host: cAdvisor
      # exposes 35 series, ZERO of them Docker containers, and no `name` label at
      # all — {__name__=~"container_.*", name!=""} returns nothing. Verified again
      # 2026-07-31; the cause is Docker's containerd snapshotter, recorded in
      # docs/decisions/alert-series-verification.md. Do not "fix" this rule by
      # pointing it at cAdvisor.
      #
      # What does carry it is process_start_time_seconds, exposed by each service's
      # own /metrics, plus minio_node_process_starttime_seconds for MinIO, which
      # publishes the same thing under its own name. Both change exactly once per
      # process start, so changes() over a window counts restarts.
      #
      # THRESHOLD, from measurement rather than intuition. Legitimate deploy churn
      # peaks at THREE changes in a 10m window across the full 7-day retention
      # (traefik; everything else peaks at 2). `> 4` sits above that with margin,
      # and evaluating it over the whole retained week returns zero series — it
      # would not have fired once on real activity. It also matches the working
      # definition: one restart after an OOM is not an incident, five in ten
      # minutes is.
      #
      # `for: 2m` asks "is it STILL restarting", which is the distinction between a
      # loop and a bad afternoon.
      #
      # COVERAGE IS 12 OF 16 PLATFORM CONTAINERS, and the gap is honest:
      # openbao, portainer, postgres and promtail expose no metrics endpoint and
      # are not scrape targets, so no signal exists for them at any threshold.
      # Note also that postgres-exporter restarting is NOT postgres restarting.
      #
      # TENANT CONTAINERS ARE DELIBERATELY NOT COVERED. app-* are scraped by
      # nothing, so extending this is blocked on a scrape target existing before it
      # is blocked on the tenancy question — see docs/decisions/alerting-audit.md.
      - alert: ContainerRestartLoop
        expr: |
          (changes(process_start_time_seconds[10m])
            or changes(minio_node_process_starttime_seconds[10m])) > 4
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is in a restart loop"
          description: >-
            {{ $labels.job }} ({{ $labels.instance }}) has restarted {{ $value }}
            times in the last 10 minutes and is still restarting. A single restart
            after an OOM would not reach this threshold; a crash loop does. Note
            that `up == 0` will NOT be firing — the container is coming back each
            time, which is why this rule exists separately.
          action: >-
            `docker ps -a --filter name={{ $labels.job }}` and read the exit code
            first: 137 is OOM-killed, so check `mem_limit` for that service in
            deploy/compose/prod/. Then `docker logs --tail 100 {{ $labels.job }}`
            for what it says just before dying — in a loop the useful line is at the
            END of each cycle, not the start. If it is a dependency it cannot reach,
            fix that rather than raising the restart limit.
          runbook: docs/runbooks/observability.md

  - name: resource-usage
    rules:
      # RENAMED FROM HighMemoryUsage, because that name was a lie.
      #
      # It claimed to watch containers and annotated "Container {{ $labels.name }}".
      # cAdvisor on this host exposes 45 cgroup series and ZERO Docker containers:
      # count(container_memory_usage_bytes{name!=""}) is 0, and the only series
      # carrying a memory limit is id="/", whose limit is total host RAM. So the
      # rule only ever evaluated the host root cgroup, and $labels.name rendered
      # empty. Verified 2026-07-31.
      #
      # Renaming rather than deleting keeps the (real, useful) host-memory signal
      # while removing the false claim. Restoring genuine per-container alerting
      # requires fixing cAdvisor first, which is a follow-up in
      # docs/decisions/alerting-audit.md — do not simply rename this back.
      # ...and MOVED OFF cAdvisor, because the cgroup figure counts page cache.
      #
      # container_memory_usage_bytes includes reclaimable page cache. Measured on
      # this host 2026-07-31: the cgroup ratio read 0.7035 while actual memory
      # pressure was 0.3095, with 8.6 GB of that gap being cache the kernel frees
      # on demand. Peak over the full 7-day retention was 0.8122 cgroup against
      # 0.3815 true — so it has NOT yet fired, but it tracks roughly double the
      # real number and sits 0.09 below the threshold on a value that file I/O
      # moves quickly. The nightly backup reads several GB at 03:00.
      #
      # node_memory_MemAvailable_bytes is the kernel's own estimate of what can be
      # allocated without swapping, cache already discounted. It is what "memory
      # is running out" means, and it does not depend on cAdvisor — which on this
      # host is the component least able to be trusted (see
      # docs/decisions/alert-series-verification.md).
      #
      # Direction of the old error is worth keeping: usage >= working set always,
      # so the cgroup form could only ever fire EARLY, never miss real pressure.
      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory above 90% on the platform VPS"
          description: >-
            {{ $value | humanizePercentage }} of RAM on {{ $labels.instance }} is
            unavailable — that is real pressure, with page cache already discounted,
            not merely memory in use. This is HOST memory, not a single container:
            cAdvisor exposes no per-container series on this host.
          action: >-
            `free -h` on the host to confirm, then `docker stats --no-stream` to find
            the consumer. Nothing here identifies the container automatically; that
            needs cAdvisor fixed first. Note `docker stats` will not agree with this
            alert exactly — it reports usage including cache, which is the thing this
            rule deliberately stopped measuring.
          runbook: docs/runbooks/observability.md

      - alert: DiskSpaceRunningLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 15% on {{ $labels.instance }}"
          description: >-
            Root filesystem on {{ $labels.instance }} has {{ $value | humanizePercentage }}
            free space remaining.
          action: >-
            `df -h /` on the host. The usual consumers are
            /opt/hill90/backups (prune with `bash scripts/backup.sh prune 7`) and
            Docker images (`docker image prune`). prometheus-data is capped at 20GB
            and is not usually the cause.
          runbook: docs/runbooks/troubleshooting.md

  - name: postgres
    rules:
      - alert: PostgresConnectionsHigh
        # pg_stat_activity_count carries datname and state labels;
        # pg_settings_max_connections carries neither. Prometheus one-to-one
        # vector matching needs identical label sets, so dividing them directly
        # yields an empty result and the alert can never fire. Aggregate both
        # sides to a common label set first.
        expr: |
          sum by (instance) (pg_stat_activity_count)
            / max by (instance) (pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% capacity"
          description: >-
            Active connections are {{ $value | humanizePercentage }} of max_connections
            on {{ $labels.instance }}.
          action: >-
            `docker exec postgres psql -U hill90 -c "SELECT datname, state, count(*)
            FROM pg_stat_activity GROUP BY 1,2 ORDER BY 3 DESC;"` to find which
            database and which state is holding them. Idle-in-transaction is the
            usual culprit, not genuine load.
          runbook: docs/runbooks/troubleshooting.md

  - name: loki
    rules:
      # REPLACES LokiIngestionErrors, WHICH COULD NEVER FIRE. Do not restore it
      # from an old example. It was:
      #
      #     rate(loki_distributor_lines_received_total{status="error"}[5m]) > 0
      #
      # and it was wrong twice over, verified against the live deployment:
      #
      #   1. loki_distributor_lines_received_total carries aggregated_metric,
      #      instance, job and tenant. There is NO `status` label on it at all.
      #   2. Even if there were, `error` is not a value Loki uses. The `status`
      #      label exists elsewhere in Loki's metrics — on compaction, retention
      #      and tsdb operation counters — and every occurrence on this
      #      deployment reads status="success". Nothing emits status="error".
      #
      # It evaluated cleanly, reported health=ok, and matched nothing for months.
      # That is indistinguishable from health, which is why it was worse than no
      # rule. See docs/decisions/alert-series-verification.md.
      #
      # NOT USED, deliberately: loki_ingester_wal_discarded_samples_total. It is
      # the only discard counter currently emitting (2037 samples), and its label
      # is reason="duplicate" — the WAL rejecting a re-sent entry, which is
      # promtail retrying and Loki de-duplicating correctly. Alerting on it would
      # page for normal behaviour.
      #
      # Also absent: loki_discarded_samples_total does not appear in /metrics at
      # all on this deployment, and Loki has no
      # loki_distributor_ingester_append_failures_total.

      # Logs stopped arriving at all. The failure that loses everything, quietly.
      # The series is present today (11.9 lines/s), and its floor across the full
      # 7-day retention is 8.96 lines/s — it has never approached zero, so `== 0`
      # carries no false-positive risk. 15m rate plus `for: 30m` means roughly
      # three quarters of an hour of silence before this pages, which is right for
      # "you have lost observability" rather than "the estate is down".
      #
      # If Loki itself is down the series goes stale and this does NOT fire —
      # ServiceDown covers that case. This one catches Loki healthy and receiving
      # nothing, which is the case nothing else sees.
      - alert: LokiIngestionStalled
        expr: rate(loki_distributor_lines_received_total[15m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Loki has received no log lines for 45 minutes"
          description: >-
            Loki on {{ $labels.instance }} is up and accepting connections but has
            ingested nothing for the last 15 minutes, and has been in that state for
            30 minutes. Normal on this host is around 9 to 12 lines/sec and has never
            been lower. Logs from every container are being lost for as long as this
            continues, and nothing else will tell you.
          action: >-
            Check the shipper before Loki: `docker ps --filter name=promtail` and
            `docker logs --tail 50 promtail`. Promtail is NOT a Prometheus scrape
            target, so this alert is the only signal that it has stopped. If promtail
            is healthy, `docker logs --tail 50 loki` and confirm the push endpoint
            with `docker exec loki wget -qO- http://localhost:3100/ready`.
          runbook: docs/runbooks/observability.md

      # Logs actively rejected, as opposed to absent. 429 is rate-limiting or a
      # per-stream limit; 5xx is Loki failing to accept. Either way lines are lost.
      #
      # THE SELECTOR MATCHES NOTHING TODAY, AND THAT IS NOT THE OLD BUG.
      # status_code is a REAL label on this metric, carrying observed values
      # 200, 204, 503 and "success" across routes — a 503 has genuinely been
      # recorded on route="ready". The push route has only ever returned 204, so
      # the non-2xx series has not been created yet; it appears the moment a push
      # is rejected. Contrast the old rule, whose `status` label does not exist on
      # its metric under any condition. Declared in
      # scripts/checks/alert-series-allowlist.txt with that reasoning.
      - alert: LokiPushRejected
        expr: |
          sum by (status_code) (
            rate(loki_request_duration_seconds_count{route="loki_api_v1_push", status_code!~"2.."}[5m])
          ) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is rejecting log pushes with HTTP {{ $labels.status_code }}"
          description: >-
            Loki is returning {{ $labels.status_code }} to {{ $value }} pushes/sec on
            the ingest endpoint. Log lines are being LOST while this fires. 429 means
            a rate or per-stream limit; 5xx means Loki could not accept the write.
          action: >-
            `docker logs --tail 50 loki` for the rejection reason. A 429 is
            configuration — limits_config in platform/observability/loki/loki.yml —
            and raising a limit is a deliberate choice, not a reflex. A 5xx is not
            configuration: check disk with `df -h /`, since a full disk presents this
            way. Do not restart Loki to clear it; that loses the WAL and the reason.
          runbook: docs/runbooks/observability.md

  - name: tempo
    rules:
      - alert: TempoIngestionErrors
        expr: rate(tempo_distributor_ingester_append_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tempo ingestion errors detected"
          description: >-
            Tempo is failing to append traces at {{ $value }}/sec on {{ $labels.instance }}.
            Traces are being LOST while this fires.
          action: >-
            `docker logs --tail 50 tempo`. This fired for ~1.3 cumulative hours in the
            week to 2026-07-31 with nobody watching, so treat a first delivery as
            possibly long-standing rather than new.
          runbook: docs/runbooks/observability.md

  # ---------------------------------------------------------------------------
  # Certificates. Specified in docs/runbooks/certificate-renewal.md (#615); the
  # thresholds below are that document's, not new numbers.
  #
  # SERIES VERIFIED ON THE LIVE PROMETHEUS before these were written, per the
  # method in docs/decisions/alert-series-verification.md (#619):
  #   traefik_tls_certs_not_after   11 series
  #   label set                     cn, instance, job, sans, serial
  #   cn present on ALL series      yes  (the annotations interpolate it)
  #   (value - time())/86400        42.7 .. 87.8 days — real numbers, not an
  #                                 empty vector, so the comparison can match
  # The metric needs nothing enabled and is already scraped by the traefik job.
  # ---------------------------------------------------------------------------
  - name: certificates
    rules:
      # Let's Encrypt issues for 90 days; Traefik renews below 30 and retries
      # every 24h. So every day under 30 is one more FAILED attempt, and the
      # threshold is really "how many consecutive failures before waking
      # someone". 21 days = nine failures, with three weeks of runway left.
      - alert: CertificateExpiringSoon
        expr: (traefik_tls_certs_not_after - time()) / 86400 < 21
        # Not about the certificate — the value moves once a day. This guards
        # against a single failed scrape producing a spurious evaluation.
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.cn }} expires in {{ $value | printf \"%.0f\" }} days"
          description: >-
            Certificate renewal for {{ $labels.cn }} has been failing for roughly nine
            days. Traefik renews below 30 days remaining and retries every 24 hours, so
            every day under 30 is another failed attempt — this is a persistent fault,
            not a slow night.
          action: >-
            FIRST check whether it is one certificate or several: `docker exec prometheus
            wget -qO- 'http://localhost:9090/api/v1/query?query=(traefik_tls_certs_not_after-time())/86400'`.
            If several DNS-01 hosts are falling together they share one Cloudflare
            credential and one store — go straight to the token. Then
            `docker logs traefik --since 48h | grep -iE 'acme|certificate|challenge'`;
            grep `challenge` too, because a revoked token fails as a DNS challenge error
            and looks like silence otherwise. Do NOT delete acme-dns.json.
          runbook: docs/runbooks/certificate-renewal.md

      - alert: CertificateExpiringCritical
        expr: (traefik_tls_certs_not_after - time()) / 86400 < 10
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.cn }} expires in {{ $value | printf \"%.0f\" }} days"
          description: >-
            Roughly twenty consecutive renewal failures for {{ $labels.cn }}. The warning
            at 21 days was missed. Still fixable, no longer comfortable — and fixing a
            revoked DNS token means the Cloudflare dashboard, a SOPS edit and an edge
            deploy.
          action: >-
            Same sequence as CertificateExpiringSoon, but do not wait for the 24h retry
            cycle after fixing the cause. Restarting Traefik forces an immediate attempt
            and is a deliberate act — it drops in-flight connections on the component
            every service sits behind.
          runbook: docs/runbooks/certificate-renewal.md

      # Covers the failure the expiry rules structurally cannot see: a
      # certificate that VANISHED rather than aged. Self-adjusting, so adding or
      # retiring a host needs no edit here.
      #
      # for: 2h is load-bearing. A Traefik restart makes every series disappear
      # briefly, and ServiceDown already reports Traefik being down — this must
      # not double-report it. Verified that `offset 1h` has data (count 11 both
      # now and an hour ago), so the comparison evaluates rather than silently
      # returning an empty vector.
      - alert: CertificateCountDropped
        expr: |
          count(traefik_tls_certs_not_after)
            < count(traefik_tls_certs_not_after offset 1h)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Traefik is serving fewer certificates than it was an hour ago"
          description: >-
            The number of certificates Traefik holds has dropped and stayed down for two
            hours. An expiry alert cannot see this: a certificate that disappears has no
            series left to be near expiry. Traefik being down is a different alert.
          action: >-
            `docker exec traefik wget -qO- http://localhost:8082/metrics | grep -c
            '^traefik_tls_certs_not_after'` and compare with the router list. A host
            removed on purpose explains it; otherwise suspect the ACME store. Do NOT
            delete acme-dns.json — it holds the account key and every DNS-01
            certificate, and re-issuance runs straight into rate limits.
          runbook: docs/runbooks/certificate-renewal.md

  # ---------------------------------------------------------------------------
  # Backups. Specified in docs/decisions/backup-failure-signal.md (#616).
  #
  # THE DESIGN IS "ALERT ON THE ABSENCE OF SUCCESS", not the presence of
  # failure — because a job that never runs at all emits no failure. That is why
  # the trigger is a staleness comparison against last_success, and why
  # BackupSignalMissing exists underneath it.
  #
  # SERIES NOTE: hill90_backup_last_success_timestamp_seconds does not exist
  # until backup.sh has completed one full backup-all run. Until then
  # BackupSignalMissing is the rule that covers the gap — deliberately, and see
  # the runbook for the post-deploy seeding step.
  # ---------------------------------------------------------------------------
  - name: backups
    rules:
      # Job runs 03:00 UTC daily and takes about a minute, so a healthy gap is
      # 24h plus seconds. 26h = one missed night with two hours of slack, and it
      # fires around 05:00 rather than in the small hours.
      - alert: BackupNotSucceeding
        expr: (time() - hill90_backup_last_success_timestamp_seconds) / 3600 > 26
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No fully successful backup for {{ $value | printf \"%.0f\" }} hours"
          description: >-
            Backups run nightly at 03:00 UTC from the deploy crontab on the VPS and write
            to /opt/hill90/backups/<target>/<timestamp>/. This means the last run either
            did not happen or did not fully succeed. Note that backup-all deliberately
            exits non-zero on a PARTIAL failure, so some targets may still have backed up.
          action: >-
            `tail -40 /opt/hill90/backups/cron.log` for the last run, then
            `hill90_backup_target_success` in Prometheus to see WHICH target failed
            without reading the whole log. `crontab -l -u deploy | grep hill90` confirms
            the job is still scheduled at all.
          runbook: docs/runbooks/deployment.md#scheduled-backups

      - alert: BackupNotSucceedingCritical
        expr: (time() - hill90_backup_last_success_timestamp_seconds) / 3600 > 50
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No fully successful backup for {{ $value | printf \"%.0f\" }} hours — two nights"
          description: >-
            Two consecutive nights without a complete backup. The warning was missed and
            the backup set is genuinely ageing. Restores come from these artifacts and
            nothing else does.
          action: >-
            As BackupNotSucceeding, and run one by hand once the cause is fixed:
            `cd /opt/hill90/app && SOPS_AGE_KEY_FILE=/opt/hill90/secrets/keys/keys.txt
            bash scripts/backup.sh backup-all`. Do not wait for the next 03:00.
          runbook: docs/runbooks/deployment.md#scheduled-backups

      # The watcher-watching case. If the textfile is deleted or was never
      # written, `time() - <absent>` yields NO RESULT and BackupNotSucceeding can
      # never fire — a staleness alert is silent about a metric that does not
      # exist. This is the rule that notices the alarm was removed.
      #
      # It will overlap with ServiceDown when node-exporter is the cause. That
      # duplication is accepted deliberately.
      - alert: BackupSignalMissing
        expr: absent(hill90_backup_last_success_timestamp_seconds)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The backup success metric has disappeared entirely"
          description: >-
            hill90_backup_last_success_timestamp_seconds is absent, so the staleness
            alerts above cannot fire at all. Either the textfile was removed, node-exporter
            lost its textfile directory, or backup.sh has never completed a full run since
            the metric was introduced.
          action: >-
            Check the file exists and is fresh: `ls -l
            /opt/hill90/metrics/textfile_collector/hill90_backup.prom`. Then confirm
            node-exporter is reading that directory — `node_textfile_mtime_seconds` should
            have a series. If the file is there but the metric is not, the collector
            directory flag or the /rootfs mount is the fault, not the backup.
          runbook: docs/runbooks/deployment.md#scheduled-backups

  # ---------------------------------------------------------------------------
  # A deliberately inert facility for proving the notification chain end to end.
  #
  # WHY IT EXISTS. Every step of the path had been proven individually and the
  # JOIN had not. Measured 2026-07-31: Prometheus had evaluated rules and produced
  # ALERTS, and Alertmanager had delivered email — but
  # prometheus_notifications_sent_total was 0, and its maximum across the whole
  # 7-day retention was also 0. Not one notification had ever travelled from
  # Prometheus to Alertmanager. The two emails on record came from alerts injected
  # straight into Alertmanager's API, which bypasses precisely the link in doubt.
  #
  # A delivery test that starts at Alertmanager cannot prove the link. This rule
  # starts at Prometheus, so it can.
  #
  # HOW TO RUN IT. The condition is a file, so no deploy is needed to fire or
  # clear it — only this rule needed deploying, once:
  #
  #   mkdir -p /opt/hill90/metrics/textfile_collector
  #   printf 'hill90_e2e_delivery_test 1\n' > \
  #     /opt/hill90/metrics/textfile_collector/e2e-delivery-test.prom     # fires
  #   rm /opt/hill90/metrics/textfile_collector/e2e-delivery-test.prom    # resolves
  #
  # The mkdir is not decoration. That directory is created by backup.sh's
  # `mkdir -p` on its first run, NOT by a deploy — so on a rebuilt host, before
  # the first nightly backup, it does not exist and the bare redirect fails with
  # "No such file or directory". Verified 2026-07-31.
  #
  # Write atomically in anything scripted (write .tmp, then mv): node-exporter
  # reads the directory on every scrape and a half-written file flips
  # node_textfile_scrape_error to 1, which is itself alertable.
  #
  # WARN A HUMAN FIRST. This sends real mail to a real person.
  #
  # ---------------------------------------------------------------------------
  # WHY THIS CANNOT PAGE ANYONE UNPROMPTED — checked, not assumed, 2026-07-31.
  #
  # It lives permanently in the rule set at severity critical, so "safe because
  # everyone remembers" is not good enough. Every path to the series was closed:
  #
  #   1. The only producer of hill90_e2e_delivery_test is node-exporter's textfile
  #      collector reading /opt/hill90/metrics/textfile_collector. Nothing else on
  #      the host or in this repo emits that name.
  #   2. The only writer to that directory is backup.sh, and its filename is a
  #      fixed METRICS_FILE="hill90_backup.prom". It cannot write the test file.
  #   3. No recording rules exist — every rule in this file is an alert — so
  #      nothing can synthesise the series from other metrics.
  #   4. No crontab entry and no systemd timer writes to that directory.
  #   5. It is NOT in any backup. BACKUP_ROOT is /opt/hill90/backups, a sibling,
  #      and backup_observability tars named Docker volumes only. So no restore
  #      can reintroduce a stale test file — the one non-obvious path, since a
  #      backup taken mid-test would otherwise carry the trigger.
  #   6. A value of 0 does not fire, and a unit test pins that. A leftover file
  #      with the metric zeroed is inert rather than a trap.
  #
  # AND IT STILL WORKS AFTER A DEPLOY. The flag and the /rootfs mount are both in
  # deploy/compose/prod/docker-compose.observability.yml, so they survive
  # container replacement. Demonstrated rather than argued: hill90_backup.prom was
  # written 10:32, node-exporter was replaced at 11:47, and the metric was still
  # being served afterwards with node_textfile_scrape_error=0. The end-to-end test
  # itself then ran at 11:54 — after that replacement — and delivered.
  # ---------------------------------------------------------------------------
  #
  # severity is critical ON PURPOSE, so the test traverses the same Alertmanager
  # route as PublicSiteDown (group_wait 10s) rather than a slower one. It is the
  # site-down path being measured, not a generic one.
  #
  # There is no `for:`, so the measurement isolates the pipeline — scrape,
  # evaluation, notify, group_wait, SMTP — from a rule's deliberate holding
  # period. For the site-down figure, add PublicSiteDown's `for: 2m` to whatever
  # this measures.
  #
  # It cannot fire on its own: the series does not exist unless somebody creates
  # that file. Declared in scripts/checks/alert-series-allowlist.txt on that basis.
  # ---------------------------------------------------------------------------
  - name: delivery-test
    rules:
      - alert: TEST_IGNORE_DeliveryPathCheck
        expr: hill90_e2e_delivery_test > 0
        labels:
          severity: critical
        annotations:
          summary: "TEST ALERT — IGNORE. Nothing is wrong. Deliberate delivery check."
          description: >-
            THIS IS A TEST. It is not an incident, no service is affected, and no
            action is needed. Someone is deliberately proving that alerts reach a
            human, by creating a file on the VPS purely to make this rule fire. It
            clears when that file is deleted, and you should receive a RESOLVED mail
            shortly afterwards — that resolve is half of what the test proves.
          action: >-
            None. If this arrived unannounced, it is still not an incident: the file
            /opt/hill90/metrics/textfile_collector/e2e-delivery-test.prom exists on
            the VPS and deleting it clears this alert immediately. Nothing else is
            affected by it.
          runbook: docs/decisions/alert-series-verification.md
