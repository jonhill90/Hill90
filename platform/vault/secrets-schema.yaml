# Canonical mapping: vault KV paths <-> SOPS keys <-> compose ${VAR} refs
# Validated by scripts/checks/check_secrets_schema.py
#
# Each runtime_secrets entry maps:
#   key:          The env var name
#   vault_path:   Vault KV v2 path where this key lives
#   compose_refs: Compose files that reference ${KEY} (basename only)
#   dedup:        (optional) Other vault paths that contain this key
#
# Validation runs on every PR (advisory). Catches drift between vault,
# SOPS, and compose before it reaches production.

# Non-secret env vars referenced in compose files via ${VAR} but NOT
# stored in vault or SOPS. These are skipped during validation.
excluded_vars:
  # Local/production parity surface. Every one of these carries a production
  # default in the compose files, so an unset environment still resolves to the
  # production stack. Documented in .env.local.example and enforced by
  # scripts/checks/check_env_surface.py.
  - BASE_DOMAIN
  - TRAEFIK_HOST
  - PORTAINER_HOST
  - GRAFANA_HOST
  - VAULT_HOST
  - GRAFANA_ROOT_URL
  - ADMIN_ENTRYPOINT
  - ADMIN_CERT_RESOLVER
  - ADMIN_MIDDLEWARES
  - TRAEFIK_MIDDLEWARES
  - TRAEFIK_STATIC_CONFIG
  - CONTAINER_PREFIX
  - NETWORK_PREFIX
  - VOLUME_PREFIX
  - VOLUME_PREFIX_BARE
  - HTTP_PORT
  - HTTPS_PORT
  # Storage backend selection for the vault, used by
  # .github/workflows/vault-reinitialize.yml. Both default to the file-backend
  # values so an unset environment resolves to what production has always run.
  - VAULT_CONFIG_FILE
  - VAULT_DATA_PATH
  - AUTH_HOST
  - KC_HOSTNAME
  - PUBLIC_ENTRYPOINT
  - PUBLIC_CERT_RESOLVER
  # Where the OTHER platform services reach Keycloak, and whether Grafana's SSO
  # is switched on. Not secrets — the client secrets themselves are in
  # runtime_secrets. All default to the production values.
  - KC_PUBLIC_URL
  - KC_REALM
  - GRAFANA_OIDC_ENABLED
  # Object store routing and the claim MinIO reads its policy from. Not
  # secrets; all default to the production values.
  - MINIO_HOST
  - MINIO_PUBLIC_URL
  - MINIO_OIDC_CLAIM_NAME

runtime_secrets:
  - key: DB_USER
    vault_path: secret/shared/database
    compose_refs:
      - docker-compose.db.yml
      - docker-compose.auth.yml

  - key: DB_PASSWORD
    vault_path: secret/shared/database
    compose_refs:
      - docker-compose.db.yml
      - docker-compose.auth.yml

  - key: DB_NAME
    vault_path: secret/shared/database
    compose_refs: []

  - key: KC_ADMIN_USERNAME
    vault_path: secret/auth/config
    compose_refs:
      - docker-compose.auth.yml

  - key: KC_ADMIN_PASSWORD
    vault_path: secret/auth/config
    compose_refs:
      - docker-compose.auth.yml

  # Read by BOTH sides of the OpenBao/Keycloak OIDC pairing: Keycloak
  # substitutes it into platform-realm.json at import, and vault.sh setup-oidc
  # writes it into OpenBao. It was previously classified vault-management-only
  # ("no compose ${VAR} references"), which is no longer true.
  - key: VAULT_OIDC_CLIENT_SECRET
    vault_path: secret/auth/config
    compose_refs:
      - docker-compose.auth.yml

  - key: TRAEFIK_ADMIN_PASSWORD_HASH
    vault_path: secret/infra/traefik
    compose_refs: []

  - key: ACME_EMAIL
    vault_path: secret/infra/traefik
    compose_refs: []

  # Selects the ACME certificate authority. Consumed by
  # scripts/render-traefik-config.sh, which renders it into the Traefik static
  # config — NOT by compose. It was a compose variable until the CLI flags that
  # used it were removed; Traefik discarded them because a mounted static config
  # file wins over CLI flags. It has no default anywhere, deliberately: a
  # staging default silently replaces every certificate with an untrusted one,
  # and a production default burns real rate limits.
  - key: ACME_CA_SERVER
    vault_path: secret/infra/traefik
    compose_refs: []

  # Cloudflare API token for the ACME DNS-01 challenge. Scoped to the
  # hill90.com zone with Zone/Zone/Read + Zone/DNS/Edit. Consumed directly by
  # lego inside Traefik, which replaced the dns-manager shim.
  - key: CF_DNS_API_TOKEN
    vault_path: secret/infra/traefik
    compose_refs:
      - docker-compose.infra.yml

  # --- secret/infra/vps ---
  # Hostinger remains the VPS host and the mail provider; this key is the VPS
  # management API credential used by scripts/vps.sh and recreate-vps.yml. It
  # is no longer part of any DNS path and is not referenced by compose.
  - key: HOSTINGER_API_KEY
    vault_path: secret/infra/vps
    compose_refs: []

  - key: GRAFANA_ADMIN_PASSWORD
    vault_path: secret/observability/grafana
    compose_refs:
      - docker-compose.observability.yml

  # --- Keycloak SSO for platform services (issue #530) ---
  - key: GRAFANA_OIDC_CLIENT_SECRET
    vault_path: secret/observability/grafana
    compose_refs:
      - docker-compose.observability.yml

  # --- secret/storage/minio ---
  # MINIO_ROOT_USER and MINIO_ROOT_PASSWORD already exist in prod.enc.env: they
  # were orphaned when MinIO was removed in #495 and are REUSED rather than
  # rotated, so the existing prod_minio-data volume stays readable.
  - key: MINIO_ROOT_USER
    vault_path: secret/storage/minio
    compose_refs:
      - docker-compose.minio.yml

  - key: MINIO_ROOT_PASSWORD
    vault_path: secret/storage/minio
    compose_refs:
      - docker-compose.minio.yml

  - key: MINIO_OIDC_CLIENT_SECRET
    vault_path: secret/storage/minio
    compose_refs:
      - docker-compose.minio.yml

  # Portainer stores auth settings in its own database, applied through its API
  # by scripts/portainer.sh, so there is no compose reference for these two.
  - key: PORTAINER_OIDC_CLIENT_SECRET
    vault_path: secret/infra/portainer
    compose_refs: []

  - key: PORTAINER_ADMIN_PASSWORD
    vault_path: secret/infra/portainer
    compose_refs: []

  # The hill90-app tenant's login on the platform's Postgres, created by
  # scripts/provision-tenant-db.sh. compose_refs is empty and stays empty: no
  # platform compose file consumes this. The platform sets the credential and
  # the tenant reads it from here, which makes this store the authoritative
  # copy — see docs/decisions/tenant-databases-on-platform-postgres.md.
  - key: HILL90_APP_DB_PASSWORD
    vault_path: secret/tenants/hill90-app/database
    compose_refs: []

  # The tenant's OIDC client secret for hill90-ui in realm platform. Substituted
  # into platform-realm.json at import, exactly like VAULT_OIDC_CLIENT_SECRET.
  # It bites only on a FIRST import — the live realm already has the client — so
  # a VPS rebuild is what depends on it being present and CORRECT.
  - key: HILL90_UI_CLIENT_SECRET
    vault_path: secret/tenants/hill90-app/oidc
    compose_refs:
      - docker-compose.auth.yml

  # The tenant's least-privilege MinIO credential. Scoped by policy
  # `tenant-hill90-app` to exactly its three buckets — it cannot create buckets,
  # read .minio.sys or reach any admin API, which is the same shape as the tenant's
  # Postgres role rather than handing it the platform root keys.
  # No compose ref here: this platform mints the credential, the tenant consumes it.
  - key: MINIO_TENANT_ACCESS_KEY
    vault_path: secret/tenants/hill90-app/objectstore
    compose_refs: []

  - key: MINIO_TENANT_SECRET_KEY
    vault_path: secret/tenants/hill90-app/objectstore
    compose_refs: []

# SOPS-only secrets: bootstrap/infrastructure keys that have no vault
# KV mapping. These must exist in prod.enc.env.example but are not
# expected in vault.
bootstrap_secrets:
  - VPS_HOST
  - VPS_IP
  - TAILSCALE_AUTH_KEY
  - GHCR_TOKEN

# Vault management secrets: generated during vault setup, stored in
# SOPS for DR. No compose ${VAR} references.
vault_management_secrets:
  - OPENBAO_UNSEAL_KEY
  - VAULT_SYNC_TOKEN

# Services that get AppRole credentials (VAULT_{SVC}_ROLE_ID and
# VAULT_{SVC}_SECRET_ID pairs in SOPS).
vault_approle_services:
  - db
  - auth
  - infra
  - observability
  # VAULT_MINIO_ROLE_ID / VAULT_MINIO_SECRET_ID are already in prod.enc.env,
  # orphaned by #495 and accounted for again now the service exists.
  - minio
