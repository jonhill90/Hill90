# Traefik Dynamic Configuration - Middlewares
# https://doc.traefik.io/traefik/middlewares/overview/

http:
  middlewares:
    # Security Headers
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          Server: ""

    # Rate Limiting
    rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 50

    # Basic Auth for Traefik Dashboard
    auth:
      basicAuth:
        usersFile: /etc/traefik/dynamic/.htpasswd

    # Tailscale-only access (CGNAT range)
    #
    # This is CGNAT-only again as of 2026-07-27, and it is now a real control.
    # Traefik previously saw 172.18.0.1 for tailnet traffic because Tailscale
    # masqueraded anything carrying its firewall mark; `tailscale set
    # --snat-subnet-routes=false` removed that rule, and Traefik now logs true
    # client addresses (verified: a request from 100.127.120.73 logs as
    # 100.127.120.73, not the gateway).
    #
    # Removing the gateway CIDR also closed an inbound IPv6 path. hill90_edge is
    # IPv4-only so Docker writes no v6 DNAT rule, but docker-proxy still binds
    # [::]:443, so a v6 connection is re-originated from the bridge gateway.
    # It used to match this list. It no longer does: grafana and portainer now
    # answer 403 to that path and 302/200 over the tailnet.
    #
    # Do not re-add 172.18.0.1/32 without first re-checking the SNAT rule --
    # if it returns, tailnet traffic breaks and adding the CIDR back reopens v6.
    # NOTE: ipWhiteList is Traefik v2. If upgrading to v3, use ipAllowList.
    #
    # This list must contain ONLY the Tailscale CGNAT range. It previously also
    # carried the Docker bridge gateway, "172.18.0.1/32", added because proxied
    # requests were once observed arriving with the gateway as their source
    # after a daemon restart.
    #
    # That entry is removed, for two reasons.
    #
    # It is stale. The access log covers a daemon restart (2026-07-21 03:02 UTC)
    # and every Tailscale request after it arrived with its real CGNAT source
    # address, never the gateway. The IPv4 DNAT rules that preserve the source
    # address are present, which is why.
    #
    # More importantly it is not a workable control even if the symptom returns.
    # The gateway address carries no information about where a request came
    # from: anything the container runtime rewrites arrives with that same
    # source, so a rewritten request from off-network is indistinguishable from
    # a rewritten request from Tailscale. An allowlist entry that cannot tell
    # those apart is not narrowing anything.
    #
    # If the restart symptom does recur, admin routes return 403 until the
    # runtime's forwarding rules settle. That is the correct direction to fail:
    # a temporary lockout, recoverable over SSH, rather than a permanently
    # widened allowlist. Do not re-add a bare gateway CIDR to fix it — match on
    # something an external client cannot present.
    tailscale-only:
      ipWhiteList:
        sourceRange:
          - "100.64.0.0/10"

    # Compression
    compress:
      compress: {}

    # CORS (if needed)
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
        accessControlAllowOriginList:
          - "https://hill90.com"
          - "https://www.hill90.com"
        accessControlMaxAge: 100
        addVaryHeader: true
