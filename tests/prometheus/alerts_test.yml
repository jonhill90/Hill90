# Unit tests for platform/observability/prometheus/alerts.yml.
#
# Run:  promtool test rules tests/prometheus/alerts_test.yml
# CI:   .github/workflows/ci.yml, job `prometheus-rules`
#
# ---------------------------------------------------------------------------
# WHAT THIS SUITE CAN AND CANNOT PROVE. Read before trusting a green run.
#
# It CAN prove: the expression computes what you meant, the threshold is on the
# right side, `for:` holds firing off for the right duration, aggregation
# produces a matchable vector, and the annotation templates render to real text
# rather than to blanks.
#
# It CANNOT prove the series exist in production. Every input_series below is
# INVENTED BY THE TEST AUTHOR. If a rule matches on a label production never
# emits, the test still passes, because the test hands the rule exactly the
# labels it asked for.
#
# That is not hypothetical, and the proof is that a rule used to be tested here.
# LokiIngestionErrors matched {status="error"} on a metric carrying no `status`
# label, and it had a PASSING TEST IN THIS FILE while being incapable of firing
# in production — because the test invented the label the rule asked for. It was
# removed once the live check caught what this suite structurally could not.
#
# Every rule below is subject to the same blind spot. Do not read a green run as
# evidence that an alert works.
#
# The complementary check is scripts/checks/check_alert_series.py, which asks the
# live Prometheus whether each selector matches anything. Neither test is
# sufficient alone: this one proves the logic, that one proves the data.
# ---------------------------------------------------------------------------

rule_files:
  - ../../platform/observability/prometheus/alerts.yml

evaluation_interval: 1m

tests:
  # --- availability ---------------------------------------------------------

  - name: PublicSiteDown fires 2m after the public probe stops returning 200
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", instance="https://hill90.com/"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: PublicSiteDown
        exp_alerts: []          # `for: 2m` not yet satisfied
      - eval_time: 3m
        alertname: PublicSiteDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-public
              instance: https://hill90.com/
            exp_annotations:
              summary: "hill90.com is not answering from the internet"
              description: "The blackbox probe of https://hill90.com/ has not received HTTP 200 for over 2 minutes. This is the tenant's UI — the public product — so users are seeing this too."
              action: "Check the edge before the app: `docker ps --filter name=traefik` and `docker logs --tail 50 traefik`. If Traefik is healthy, the tenant's app-ui is the next suspect — it is NOT a Prometheus scrape target, so this probe is the only signal. Confirm from outside with `curl -sI https://hill90.com`."
              runbook: docs/runbooks/troubleshooting.md

  - name: TenantApiDown fires 2m after the API probe stops returning 200
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-tenant-api", instance="https://api.hill90.com/health"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: TenantApiDown
        exp_alerts: []          # `for: 2m` not yet satisfied
      - eval_time: 3m
        alertname: TenantApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-tenant-api
              instance: https://api.hill90.com/health
            exp_annotations:
              summary: "api.hill90.com is not answering from the internet"
              description: "The blackbox probe of https://api.hill90.com/health has not received HTTP 200 for over 2 minutes. hill90.com can still return 200 while this is broken — the UI's own /api/health reports service \"ui\" and does not proxy to the API — so PublicSiteDown will NOT cover this. Signed-in features that call the API are failing for users."
              action: "Check the edge first: `docker ps --filter name=traefik`. Then the tenant's container, which is NOT a Prometheus scrape target — `docker ps -a --filter name=app-api` and `docker logs --tail 50 app-api`. Confirm from outside with `curl -s https://api.hill90.com/health`. This is the TENANT's container: the platform can see it is down but cannot fix it, so the tenant's deploy path is where the repair happens."
              runbook: docs/decisions/tenant-monitoring-coverage.md

  - name: TenantApiDown stays silent while the API probe succeeds
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-tenant-api", instance="https://api.hill90.com/health"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantApiDown
        exp_alerts: []

  # The two probes are independent: a dead API must not be masked by a healthy site.
  - name: a healthy public site does not suppress TenantApiDown
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", instance="https://hill90.com/"}'
        values: '1x10'
      - series: 'probe_success{job="blackbox-tenant-api", instance="https://api.hill90.com/health"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: PublicSiteDown
        exp_alerts: []
      - eval_time: 5m
        alertname: TenantApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-tenant-api
              instance: https://api.hill90.com/health
            exp_annotations:
              summary: "api.hill90.com is not answering from the internet"
              description: "The blackbox probe of https://api.hill90.com/health has not received HTTP 200 for over 2 minutes. hill90.com can still return 200 while this is broken — the UI's own /api/health reports service \"ui\" and does not proxy to the API — so PublicSiteDown will NOT cover this. Signed-in features that call the API are failing for users."
              action: "Check the edge first: `docker ps --filter name=traefik`. Then the tenant's container, which is NOT a Prometheus scrape target — `docker ps -a --filter name=app-api` and `docker logs --tail 50 app-api`. Confirm from outside with `curl -s https://api.hill90.com/health`. This is the TENANT's container: the platform can see it is down but cannot fix it, so the tenant's deploy path is where the repair happens."
              runbook: docs/decisions/tenant-monitoring-coverage.md

  - name: PublicSiteDown stays silent while the probe succeeds
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", instance="https://hill90.com/"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: PublicSiteDown
        exp_alerts: []

  - name: PublicSiteDown does not fire on a blip shorter than `for`
    # A deploy replacing app-ui takes seconds. One failed probe must not page.
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", instance="https://hill90.com/"}'
        values: '1 1 0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 7m
        alertname: PublicSiteDown
        exp_alerts: []

  - name: VaultSealedOrUnreachable fires 5m after the health probe stops
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-vault", instance="http://openbao:8200/v1/sys/health"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: VaultSealedOrUnreachable
        exp_alerts: []
      - eval_time: 6m
        alertname: VaultSealedOrUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-vault
              instance: http://openbao:8200/v1/sys/health
            exp_annotations:
              summary: "OpenBao is sealed, uninitialised or unreachable"
              description: "The unauthenticated health probe of http://openbao:8200/v1/sys/health has not returned HTTP 200 for over 5 minutes. 503 means SEALED, 501 means uninitialised. A sealed vault breaks nothing user-facing, which is exactly why this would otherwise go unnoticed until the next deploy — or until a recovery."
              action: "Run `docker exec openbao bao status`. If it reports `Sealed true`, unseal with `bash scripts/vault.sh unseal`. If this followed a reboot, the systemd unit hill90-vault-unseal did not do its job — check `systemctl status hill90-vault-unseal` before unsealing by hand, or the same thing happens after the next reboot."
              runbook: docs/runbooks/vault-unseal.md

  # --- service-health -------------------------------------------------------

  - name: ServiceDown fires after 5m and names the job in its annotations
    # The annotation assertions are the point as much as the firing: the rule
    # this replaced annotated {{ $labels.name }}, a label cAdvisor never emits,
    # so it rendered "Container " and told the reader nothing.
    interval: 1m
    input_series:
      - series: 'up{job="loki", instance="loki:3100"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: loki
              instance: loki:3100
            exp_annotations:
              summary: "Scrape target loki is down"
              description: "Scrape target loki:3100 (job loki) has been down for more than 5 minutes on the platform host."
              action: "`docker ps -a --filter name=loki` then `docker logs --tail 50 loki`. If the container is healthy but the target is down, the metrics endpoint or the internal network is the fault, not the service."
              runbook: docs/runbooks/observability.md

  - name: ServiceDown stays silent while the target is up
    interval: 1m
    input_series:
      - series: 'up{job="loki", instance="loki:3100"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ServiceDown
        exp_alerts: []

  - name: ContainerRestartLoop fires on five restarts in ten minutes and names the container
    # Each change of process_start_time_seconds is one process start.
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="loki", instance="loki:3100"}'
        values: '1000 1001 1002 1003 1004 1005x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ContainerRestartLoop
        exp_alerts: []          # condition true from 5m; `for: 2m` not yet met
      - eval_time: 8m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              job: loki
              instance: loki:3100
            exp_annotations:
              summary: "loki is in a restart loop"
              description: "loki (loki:3100) has restarted 5 times in the last 10 minutes and is still restarting. A single restart after an OOM would not reach this threshold; a crash loop does. Note that `up == 0` will NOT be firing — the container is coming back each time, which is why this rule exists separately."
              action: "`docker ps -a --filter name=loki` and read the exit code first: 137 is OOM-killed, so check `mem_limit` for that service in deploy/compose/prod/. Then `docker logs --tail 100 loki` for what it says just before dying — in a loop the useful line is at the END of each cycle, not the start. If it is a dependency it cannot reach, fix that rather than raising the restart limit."
              runbook: docs/runbooks/observability.md

  - name: ContainerRestartLoop stays silent through ordinary deploy churn
    # THE THRESHOLD REGRESSION TEST. Three changes in a 10m window is the MAXIMUM
    # legitimate churn observed across the full 7-day retention (traefik; every
    # other job peaked at 2). If someone lowers the threshold to > 2, this test
    # fails — which is the point. A deploy must never page anyone.
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="traefik", instance="traefik:8082"}'
        values: '1000 1001 1002 1003x12'
    alert_rule_test:
      - eval_time: 8m
        alertname: ContainerRestartLoop
        exp_alerts: []
      - eval_time: 14m
        alertname: ContainerRestartLoop
        exp_alerts: []

  - name: ContainerRestartLoop stays silent for one restart that then holds
    # "A container that restarts once after an OOM and stays up is not an
    # incident." This encodes exactly that.
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="keycloak", instance="keycloak:9000"}'
        values: '1000 1000 1001x14'
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerRestartLoop
        exp_alerts: []

  - name: ContainerRestartLoop covers MinIO through its own start-time metric
    # MinIO does not expose process_start_time_seconds. It publishes the same
    # thing as minio_node_process_starttime_seconds, which is why the expression
    # is an `or` rather than one selector. Without this arm, the one platform
    # service holding tenant object data would be uncovered.
    interval: 1m
    input_series:
      - series: 'minio_node_process_starttime_seconds{job="minio", instance="minio:9000", server="127.0.0.1:9000"}'
        values: '1000 1001 1002 1003 1004 1005x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              job: minio
              instance: minio:9000
              server: 127.0.0.1:9000
            exp_annotations:
              summary: "minio is in a restart loop"
              description: "minio (minio:9000) has restarted 5 times in the last 10 minutes and is still restarting. A single restart after an OOM would not reach this threshold; a crash loop does. Note that `up == 0` will NOT be firing — the container is coming back each time, which is why this rule exists separately."
              action: "`docker ps -a --filter name=minio` and read the exit code first: 137 is OOM-killed, so check `mem_limit` for that service in deploy/compose/prod/. Then `docker logs --tail 100 minio` for what it says just before dying — in a loop the useful line is at the END of each cycle, not the start. If it is a dependency it cannot reach, fix that rather than raising the restart limit."
              runbook: docs/runbooks/observability.md

  # --- resource-usage -------------------------------------------------------

  - name: HostMemoryHigh fires on real pressure, measured without page cache
    # 5 GiB available of 50 GiB total => 90% unavailable, just over threshold.
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="node-exporter:9100", job="node-exporter"}'
        values: '4000000000x10'
      - series: 'node_memory_MemTotal_bytes{instance="node-exporter:9100", job="node-exporter"}'
        values: '50000000000x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              job: node-exporter
            exp_annotations:
              summary: "Host memory above 90% on the platform VPS"
              description: "92% of RAM on node-exporter:9100 is unavailable — that is real pressure, with page cache already discounted, not merely memory in use. This is HOST memory, not a single container: cAdvisor exposes no per-container series on this host."
              action: "`free -h` on the host to confirm, then `docker stats --no-stream` to find the consumer. Nothing here identifies the container automatically; that needs cAdvisor fixed first. Note `docker stats` will not agree with this alert exactly — it reports usage including cache, which is the thing this rule deliberately stopped measuring."
              runbook: docs/runbooks/observability.md

  - name: HostMemoryHigh is silent at the pressure this host actually runs at
    # The regression this rule was changed for. These are the real 2026-07-31
    # figures: 11.5 GiB available of 16.76 GiB => 31% unavailable. The previous
    # cgroup-based expression read 0.70 on the very same host, because it counted
    # 8.6 GiB of reclaimable page cache. Anything that makes this test fire again
    # has reintroduced that bug.
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="node-exporter:9100", job="node-exporter"}'
        values: '11514765312x10'
      - series: 'node_memory_MemTotal_bytes{instance="node-exporter:9100", job="node-exporter"}'
        values: '16761118720x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostMemoryHigh
        exp_alerts: []

  - name: DiskSpaceRunningLow fires below 15% free
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/", instance="node-exporter:9100", job="node-exporter", device="/dev/sda4", fstype="xfs"}'
        values: '10x15'
      - series: 'node_filesystem_size_bytes{mountpoint="/", instance="node-exporter:9100", job="node-exporter", device="/dev/sda4", fstype="xfs"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: DiskSpaceRunningLow
        exp_alerts:
          - exp_labels:
              severity: warning
              mountpoint: /
              instance: node-exporter:9100
              job: node-exporter
              device: /dev/sda4
              fstype: xfs
            exp_annotations:
              summary: "Disk space below 15% on node-exporter:9100"
              description: "Root filesystem on node-exporter:9100 has 10% free space remaining."
              action: "`df -h /` on the host. The usual consumers are /opt/hill90/backups (prune with `bash scripts/backup.sh prune 7`) and Docker images (`docker image prune`). prometheus-data is capped at 20GB and is not usually the cause."
              runbook: docs/runbooks/troubleshooting.md

  - name: DiskSpaceRunningLow is silent with headroom
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/", instance="node-exporter:9100", job="node-exporter"}'
        values: '50x15'
      - series: 'node_filesystem_size_bytes{mountpoint="/", instance="node-exporter:9100", job="node-exporter"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: DiskSpaceRunningLow
        exp_alerts: []

  # --- postgres -------------------------------------------------------------

  - name: PostgresConnectionsHigh aggregates across mismatched label sets
    # THE REGRESSION TEST FOR A RULE THAT COULD NEVER FIRE.
    #
    # pg_stat_activity_count carries datname and state; pg_settings_max_connections
    # carries neither. Dividing them directly yields an empty vector, because
    # one-to-one matching needs identical label sets. The `sum by (instance)` /
    # `max by (instance)` form is what makes this fire at all.
    #
    # The input below deliberately keeps those label sets DIFFERENT. Simplify it
    # to matching labels and the test passes against a broken rule.
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{instance="postgres-exporter:9187", job="postgres-exporter", server="postgres:5432", datname="hill90", state="active"}'
        values: '50x10'
      - series: 'pg_stat_activity_count{instance="postgres-exporter:9187", job="postgres-exporter", server="postgres:5432", datname="keycloak", state="idle"}'
        values: '35x10'
      - series: 'pg_settings_max_connections{instance="postgres-exporter:9187", job="postgres-exporter", server="postgres:5432"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: postgres-exporter:9187
            exp_annotations:
              summary: "PostgreSQL connections above 80% capacity"
              description: "Active connections are 85% of max_connections on postgres-exporter:9187."
              action: "`docker exec postgres psql -U hill90 -c \"SELECT datname, state, count(*) FROM pg_stat_activity GROUP BY 1,2 ORDER BY 3 DESC;\"` to find which database and which state is holding them. Idle-in-transaction is the usual culprit, not genuine load."
              runbook: docs/runbooks/troubleshooting.md

  - name: PostgresConnectionsHigh is silent at normal connection counts
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{instance="postgres-exporter:9187", job="postgres-exporter", datname="hill90", state="idle"}'
        values: '6x10'
      - series: 'pg_settings_max_connections{instance="postgres-exporter:9187", job="postgres-exporter"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: PostgresConnectionsHigh
        exp_alerts: []

  # --- tempo ----------------------------------------------------------------
  #
  # h#836, 2026-08-06: retuned from "any nonzero failure rate for 5m" to
  # "failure ratio > 5% for 15m", against a MEASURED production baseline of
  # ~1.1% (rate(failures[5m])=0.0035/s, rate(appends[5m])=0.305/s — see
  # alerts.yml's own comment for how that number and the traffic behind it
  # were established). Both directions matter equally here: a rule that only
  # proves it CAN still fire is not the same claim as one that also proves it
  # STOPPED firing on the exact background rate that used to make it
  # permanent. Neither test alone would have caught the original defect —
  # `> 0` also "fires on a rising counter" in a test exactly like the first
  # one below.

  - name: TempoIngestionErrors fires on a genuine ingestion failure (well above background)
    interval: 1m
    input_series:
      # 2/min failures against 8/min appends = 20% loss — four times the 5%
      # threshold and roughly eighteen times the ~1.1% background this
      # threshold was set against, so this is unambiguously an incident, not
      # noise on a busy day.
      - series: 'tempo_distributor_ingester_append_failures_total{instance="tempo:3200", job="tempo", ingester="127.0.0.1:9095"}'
        values: '0+2x25'
      - series: 'tempo_distributor_ingester_appends_total{instance="tempo:3200", job="tempo", ingester="127.0.0.1:9095"}'
        values: '0+8x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: TempoIngestionErrors
        exp_alerts: []          # `for: 15m` not yet satisfied
      - eval_time: 24m
        alertname: TempoIngestionErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: tempo:3200
              job: tempo
              ingester: 127.0.0.1:9095
            exp_annotations:
              summary: "Tempo ingestion errors detected"
              description: "Tempo has failed to append 20% of trace appends on tempo:3200 for 15+ minutes. Traces are being LOST while this fires, at a rate well above the ~1% background this threshold was set against (h#836)."
              action: "`docker logs --tail 50 tempo`. This fired for ~1.3 cumulative hours in the week to 2026-07-31 with nobody watching, so treat a first delivery as possibly long-standing rather than new. A background rate around 1% no longer fires this rule — see h#836 if this alert appears to have gone quiet; that was deliberate, not a regression."
              runbook: docs/runbooks/observability.md

  - name: TempoIngestionErrors is silent on the measured production background rate (~1.1%)
    interval: 1m
    input_series:
      # 1/min failures against 90/min appends = 1/91 ≈ 1.10% — matches the
      # investigated baseline almost exactly, not an arbitrary "small" number.
      # This is the case the old `> 0` rule got wrong: pending or firing on
      # 636+78 of a possible ~1440 samples in 24h, for traffic that was
      # entirely health-check polling with zero production chat traffic.
      - series: 'tempo_distributor_ingester_append_failures_total{instance="tempo:3200", job="tempo", ingester="127.0.0.1:9095"}'
        values: '0+1x25'
      - series: 'tempo_distributor_ingester_appends_total{instance="tempo:3200", job="tempo", ingester="127.0.0.1:9095"}'
        values: '0+90x25'
    alert_rule_test:
      - eval_time: 24m
        alertname: TempoIngestionErrors
        exp_alerts: []

  - name: TempoIngestionErrors is silent when nothing is being pushed at all (0/0)
    interval: 1m
    input_series:
      # Both counters flat: rate/rate is 0/0 = NaN in PromQL, and NaN > 0.05
      # is false — this must stay a non-match, not an error or a false fire,
      # since a quiet tenant is not the same claim as a failing one.
      - series: 'tempo_distributor_ingester_append_failures_total{instance="tempo:3200", job="tempo", ingester="127.0.0.1:9095"}'
        values: '0x25'
      - series: 'tempo_distributor_ingester_appends_total{instance="tempo:3200", job="tempo", ingester="127.0.0.1:9095"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 24m
        alertname: TempoIngestionErrors
        exp_alerts: []

  # --- loki -----------------------------------------------------------------
  # --- loki -----------------------------------------------------------------

  - name: LokiIngestionStalled fires when ingestion goes flat
    # A counter that stops advancing. rate() over it is 0, which is the whole
    # signal: Loki is up, answering, and receiving nothing.
    interval: 1m
    input_series:
      - series: 'loki_distributor_lines_received_total{instance="loki:3100", job="loki", tenant="fake", aggregated_metric="false"}'
        values: '5000x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: LokiIngestionStalled
        exp_alerts: []          # `for: 30m` not yet satisfied
      - eval_time: 50m
        alertname: LokiIngestionStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: loki:3100
              job: loki
              tenant: fake
              aggregated_metric: "false"
            exp_annotations:
              summary: "Loki has received no log lines for 45 minutes"
              description: "Loki on loki:3100 is up and accepting connections but has ingested nothing for the last 15 minutes, and has been in that state for 30 minutes. Normal on this host is around 9 to 12 lines/sec and has never been lower. Logs from every container are being lost for as long as this continues, and nothing else will tell you."
              action: "Check the shipper before Loki: `docker ps --filter name=promtail` and `docker logs --tail 50 promtail`. Promtail is NOT a Prometheus scrape target, so this alert is the only signal that it has stopped. If promtail is healthy, `docker logs --tail 50 loki` and confirm the push endpoint with `docker exec loki wget -qO- http://localhost:3100/ready`."
              runbook: docs/runbooks/observability.md

  - name: LokiIngestionStalled stays silent at the rate this host actually runs at
    # ~10 lines/sec, inside the 9-12 range measured on the live deployment. The
    # 7-day floor was 8.96 lines/sec, so this is the realistic quiet case.
    interval: 1m
    input_series:
      - series: 'loki_distributor_lines_received_total{instance="loki:3100", job="loki", tenant="fake", aggregated_metric="false"}'
        values: '0+600x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: LokiIngestionStalled
        exp_alerts: []

  # h#789's absence-blindness sweep: LokiIngestionStalled's own comment used to
  # claim ServiceDown covered the case where this metric disappears entirely
  # (renamed/relabeled, Loki still up). ServiceDown watches `up`, a different
  # metric, so it does not. LokiIngestionSignalMissing is the actual partner.
  - name: "THE ASSERTION THAT MATTERS: LokiIngestionSignalMissing fires when the ingestion metric never appears at all"
    # No input_series for loki_distributor_lines_received_total at all — this is
    # what the metric being renamed away or never emitted by a future Loki
    # version looks like: not stale, not old, absent from the very first eval.
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: LokiIngestionSignalMissing
        exp_alerts: []          # `for: 10m` not yet satisfied
      - eval_time: 15m
        alertname: LokiIngestionSignalMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The Loki ingestion-rate metric has disappeared entirely"
              description: "loki_distributor_lines_received_total is absent, so LokiIngestionStalled cannot fire at all. If Loki is also down, ServiceDown should be firing separately — check that first. If Loki is up and answering scrapes, the metric was likely renamed or relabeled, most plausibly after a version change."
              action: "`docker ps --filter name=loki` to rule out the down case (ServiceDown should already be firing if so). If Loki is running, `docker exec loki wget -qO- http://localhost:3100/metrics | grep -i lines_received` to find what the metric is now called, and update this rule's expr to match."
              runbook: docs/runbooks/observability.md

  - name: "CONTROL: LokiIngestionSignalMissing stays silent while the ingestion metric is present"
    interval: 1m
    input_series:
      - series: 'loki_distributor_lines_received_total{instance="loki:3100", job="loki", tenant="fake", aggregated_metric="false"}'
        values: '0+600x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: LokiIngestionSignalMissing
        exp_alerts: []

  - name: LokiPushRejected fires on 429 and names the status code
    # Rate-limited pushes. The old rule tried to express this condition and
    # selected a label that does not exist; this selects status_code, which does.
    interval: 1m
    input_series:
      - series: 'loki_request_duration_seconds_count{instance="loki:3100", job="loki", method="POST", route="loki_api_v1_push", status_code="429", ws="false"}'
        values: '0+30x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: LokiPushRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              status_code: "429"
            exp_annotations:
              summary: "Loki is rejecting log pushes with HTTP 429"
              description: "Loki is returning 429 to 0.5 pushes/sec on the ingest endpoint. Log lines are being LOST while this fires. 429 means a rate or per-stream limit; 5xx means Loki could not accept the write."
              action: "`docker logs --tail 50 loki` for the rejection reason. A 429 is configuration — limits_config in platform/observability/loki/loki.yml — and raising a limit is a deliberate choice, not a reflex. A 5xx is not configuration: check disk with `df -h /`, since a full disk presents this way. Do not restart Loki to clear it; that loses the WAL and the reason."
              runbook: docs/runbooks/observability.md

  - name: LokiPushRejected ignores successful pushes
    # THE REGRESSION TEST FOR THE STATUS-CODE MATCHER. 204 is what a healthy push
    # returns and is the ONLY code this endpoint has ever produced here. If the
    # !~"2.." matcher is broken or dropped, this test starts firing on healthy
    # traffic — which is the loudest possible failure and the right one.
    interval: 1m
    input_series:
      - series: 'loki_request_duration_seconds_count{instance="loki:3100", job="loki", method="POST", route="loki_api_v1_push", status_code="204", ws="false"}'
        values: '0+30x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: LokiPushRejected
        exp_alerts: []

  - name: LokiPushRejected ignores non-ingest routes
    # A 503 on route="ready" is real and has been observed on this deployment.
    # It is a readiness blip, not lost logs, and must not page.
    interval: 1m
    input_series:
      - series: 'loki_request_duration_seconds_count{instance="loki:3100", job="loki", method="GET", route="ready", status_code="503", ws="false"}'
        values: '0+30x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: LokiPushRejected
        exp_alerts: []

  # --- certificates -----------------------------------------------------------
  #
  # CertificateCountDropped's `for:` USED TO BE 2h, which meant this rule could
  # never fire at all — not on a total wipeout, not on the single-cert drop it
  # was written for. `offset 1h` on the right-hand side means the comparison is
  # true for AT MOST one hour after any single, permanent count change: past
  # that, the offset side has rolled forward past the change too and reads the
  # same post-change value as the left, so the condition self-resolves before
  # a 2-hour `for:` could ever complete. Caught while positive-controlling the
  # absence fix below, and fixed alongside it — see alerts.yml's own comment on
  # the rule for the full reasoning. `for: 15m` is comfortably inside the one
  # hour the comparison can actually sustain, which is also what makes a real
  # alert_rule_test possible here now — it was not, against the old `for: 2h`.

  # h#789's absence-blindness sweep: this rule exists specifically to catch
  # certificates vanishing, but as originally written (`count(x) <
  # count(x offset 1h)`, no fallback) it could not see the TOTAL case —
  # count() over zero matching series is no result, not the number 0, so if
  # every series vanished at once, both sides of the comparison went empty
  # and produced nothing. The `or vector(0)` fix makes an empty side read as
  # a real zero instead of dropping out of the comparison.
  - name: "THE ASSERTION THAT MATTERS: CertificateCountDropped fires on a TOTAL wipeout, not just a partial one"
    # Two certificate series present for the first 69 minutes, then nothing —
    # not a smaller count, no series left at all. The un-offset side goes
    # absent once 69m + 5m staleness has passed (~74m); the offset-1h side
    # stays real until 74m further on (~134m), since it is still reading the
    # pre-wipeout sample through then. `for: 15m` inside that ~60m window means
    # firing begins around 89m and holds until the offset side goes absent too.
    interval: 1m
    input_series:
      - series: 'traefik_tls_certs_not_after{cn="a.example.com", instance="traefik:8082", job="traefik", sans="a.example.com", serial="1"}'
        values: "1x69"
      - series: 'traefik_tls_certs_not_after{cn="b.example.com", instance="traefik:8082", job="traefik", sans="b.example.com", serial="2"}'
        values: "1x69"
    alert_rule_test:
      - eval_time: 80m
        alertname: CertificateCountDropped
        exp_alerts: []          # true since ~74m, but `for: 15m` not yet satisfied
      - eval_time: 100m
        alertname: CertificateCountDropped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Traefik is serving fewer certificates than it was an hour ago"
              description: "The number of certificates Traefik holds has dropped and stayed down for at least 15 minutes. An expiry alert cannot see this: a certificate that disappears has no series left to be near expiry. Traefik being down is a different alert, though a Traefik outage long enough to still be dropping certs 15 minutes in will likely also be tripping ServiceDown."
              action: "`docker exec traefik wget -qO- http://localhost:8082/metrics | grep -c '^traefik_tls_certs_not_after'` and compare with the router list. A host removed on purpose explains it; otherwise suspect the ACME store. Do NOT delete acme-dns.json — it holds the account key and every DNS-01 certificate, and re-issuance runs straight into rate limits."
              runbook: docs/runbooks/certificate-renewal.md
      - eval_time: 150m
        alertname: CertificateCountDropped
        exp_alerts: []          # self-resolved: past ~134m the offset side is absent too

  - name: "CONTROL: CertificateCountDropped still catches an ordinary partial drop (regression guard for the fix)"
    # Two series for the first 69 minutes, then only one — the realistic
    # failure mode (one host's DNS token revoked), unchanged by the fix.
    interval: 1m
    input_series:
      - series: 'traefik_tls_certs_not_after{cn="a.example.com", instance="traefik:8082", job="traefik", sans="a.example.com", serial="1"}'
        values: "1x120"
      - series: 'traefik_tls_certs_not_after{cn="b.example.com", instance="traefik:8082", job="traefik", sans="b.example.com", serial="2"}'
        values: "1x69"
    alert_rule_test:
      - eval_time: 100m
        alertname: CertificateCountDropped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Traefik is serving fewer certificates than it was an hour ago"
              description: "The number of certificates Traefik holds has dropped and stayed down for at least 15 minutes. An expiry alert cannot see this: a certificate that disappears has no series left to be near expiry. Traefik being down is a different alert, though a Traefik outage long enough to still be dropping certs 15 minutes in will likely also be tripping ServiceDown."
              action: "`docker exec traefik wget -qO- http://localhost:8082/metrics | grep -c '^traefik_tls_certs_not_after'` and compare with the router list. A host removed on purpose explains it; otherwise suspect the ACME store. Do NOT delete acme-dns.json — it holds the account key and every DNS-01 certificate, and re-issuance runs straight into rate limits."
              runbook: docs/runbooks/certificate-renewal.md

  - name: "CONTROL: CertificateCountDropped stays quiet when the count has not changed"
    interval: 1m
    input_series:
      - series: 'traefik_tls_certs_not_after{cn="a.example.com", instance="traefik:8082", job="traefik", sans="a.example.com", serial="1"}'
        values: "1x120"
      - series: 'traefik_tls_certs_not_after{cn="b.example.com", instance="traefik:8082", job="traefik", sans="b.example.com", serial="2"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: CertificateCountDropped
        exp_alerts: []

  # --- delivery test facility -----------------------------------------------

  - name: TEST_IGNORE_DeliveryPathCheck fires as soon as the test file exists
    # No `for:`, deliberately — the point of this rule is to measure the pipeline,
    # so it must not add a holding period of its own.
    interval: 1m
    input_series:
      - series: 'hill90_e2e_delivery_test{instance="node-exporter:9100", job="node-exporter"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: TEST_IGNORE_DeliveryPathCheck
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: node-exporter:9100
              job: node-exporter
            exp_annotations:
              summary: "TEST ALERT — IGNORE. Nothing is wrong. Deliberate delivery check."
              description: "THIS IS A TEST. It is not an incident, no service is affected, and no action is needed. Someone is deliberately proving that alerts reach a human, by creating a file on the VPS purely to make this rule fire. It clears when that file is deleted, and you should receive a RESOLVED mail shortly afterwards — that resolve is half of what the test proves."
              action: "None. If this arrived unannounced, it is still not an incident: the file /opt/hill90/metrics/textfile_collector/e2e-delivery-test.prom exists on the VPS and deleting it clears this alert immediately. Nothing else is affected by it."
              runbook: docs/decisions/alert-series-verification.md

  - name: TEST_IGNORE_DeliveryPathCheck cannot fire on its own
    # THE REGRESSION TEST THAT MATTERS FOR A TEST FACILITY LIVING IN PRODUCTION.
    # A value of 0 must not fire, so a stale file left behind with the metric
    # zeroed does not page anyone. Absence is covered by there being no series at
    # all, which no expression can match.
    interval: 1m
    input_series:
      - series: 'hill90_e2e_delivery_test{instance="node-exporter:9100", job="node-exporter"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: TEST_IGNORE_DeliveryPathCheck
        exp_alerts: []

  # --- scheduled-workflows (h#712, narrowed) ---------------------------------
  #
  # These four workflows have four different cadences and four different
  # thresholds — each pair below proves ITS OWN threshold, not a shared one.
  # The gauge is held at a constant 0 throughout (representing "last run was
  # at test-time zero"), so time() - metric, in this framework, equals the
  # eval_time itself — proven against a scratch rule file before trusting it
  # here, not assumed from reading promtool's docs.

  - name: ScheduledWorkflowNotTriggering (audit-hill90-ui-client) stays silent inside its 3h threshold
    interval: 1m
    input_series:
      - series: 'hill90_scheduled_workflow_last_run_timestamp_seconds{workflow="audit-hill90-ui-client"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 120m
        alertname: ScheduledWorkflowNotTriggering
        exp_alerts: []

  - name: ScheduledWorkflowNotTriggering (audit-hill90-ui-client) fires past 3h plus the hold window
    interval: 1m
    input_series:
      - series: 'hill90_scheduled_workflow_last_run_timestamp_seconds{workflow="audit-hill90-ui-client"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 240m
        alertname: ScheduledWorkflowNotTriggering
        exp_alerts:
          - exp_labels:
              severity: warning
              workflow: audit-hill90-ui-client
            exp_annotations:
              summary: "audit-hill90-ui-client has not reached a verdict in 4.0 hours"
              description: "This workflow is scheduled every 30 minutes (.github/workflows/audit-hill90-ui-client.yml). A red run is already emailed the same day by the separate workflow_run watchdog (h#712/#714) — this metric means the schedule may have stopped dispatching the workflow at all, not that a recent run failed."
              action: "Check whether the schedule is still active: GitHub disables a workflow's schedule after 60 days with no activity in the repository, and a `cron:` line can be edited or removed. `gh workflow list` and `gh run list --workflow=audit-hill90-ui-client.yml --limit 5` from a machine with repo access. If the schedule is fine but runs are not reaching the heartbeat step, the SSH/Tailscale path to the VPS is the next suspect."
              runbook: docs/decisions/scheduled-workflow-heartbeat.md

  - name: ScheduledWorkflowNotTriggering (deploy-drift) stays silent inside its 12h threshold
    interval: 1m
    input_series:
      - series: 'hill90_scheduled_workflow_last_run_timestamp_seconds{workflow="deploy-drift"}'
        values: '0x800'
    alert_rule_test:
      - eval_time: 700m
        alertname: ScheduledWorkflowNotTriggering
        exp_alerts: []

  - name: ScheduledWorkflowNotTriggering (deploy-drift) fires past 12h plus the hold window
    interval: 1m
    input_series:
      - series: 'hill90_scheduled_workflow_last_run_timestamp_seconds{workflow="deploy-drift"}'
        values: '0x1000'
    alert_rule_test:
      - eval_time: 900m
        alertname: ScheduledWorkflowNotTriggering
        exp_alerts:
          - exp_labels:
              severity: warning
              workflow: deploy-drift
            exp_annotations:
              summary: "deploy-drift has not reached a verdict in 15.0 hours"
              description: "This workflow is scheduled every 4 hours (.github/workflows/deploy-drift.yml). A red run is already emailed the same day by the separate workflow_run watchdog (h#712/#714) — this metric means the schedule may have stopped dispatching the workflow at all, not that a recent run failed. The positive-control dispatch path (deployed_sha_override) deliberately does NOT refresh this heartbeat, so repeated manual testing cannot mask a genuinely silent schedule."
              action: "Check whether the schedule is still active: GitHub disables a workflow's schedule after 60 days with no activity in the repository, and a `cron:` line can be edited or removed. `gh workflow list` and `gh run list --workflow=deploy-drift.yml --limit 5` from a machine with repo access. If the schedule is fine but runs are not reaching the heartbeat step, the SSH/Tailscale path to the VPS is the next suspect."
              runbook: docs/decisions/scheduled-workflow-heartbeat.md

  - name: ScheduledWorkflowNotTriggering (tenant-baseline-agreement) stays silent inside its 30h threshold
    interval: 1m
    input_series:
      - series: 'hill90_scheduled_workflow_last_run_timestamp_seconds{workflow="tenant-baseline-agreement"}'
