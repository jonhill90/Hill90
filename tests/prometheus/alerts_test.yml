          - exp_labels:
              severity: warning
              workflow: vault-sync-to-sops
            exp_annotations:
              summary: "The vault-sync-to-sops heartbeat metric has disappeared entirely"
              description: "hill90_scheduled_workflow_last_run_timestamp_seconds{workflow=\"vault-sync-to-sops\"} is absent, so ScheduledWorkflowNotTriggering cannot fire at all for this workflow."
              action: "Check the file exists and is fresh: `ls -l /opt/hill90/metrics/textfile_collector/hill90_scheduled_workflow_vault-sync-to-sops.prom`. Then confirm node-exporter is reading that directory — `node_textfile_mtime_seconds` should have a series. If the file is there but the metric is not, the collector directory flag or the /rootfs mount is the fault, not this workflow."
